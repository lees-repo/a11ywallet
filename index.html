<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a11ywallet | WCAG 2.2 study notes</title>
<meta name="description" content="a11ywallet: study notes for WCAG 2.2 success criteria, with what to check, how to test, common failures and code examples.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='16' width='52' height='38' rx='8' fill='%2323443A'/%3E%3Crect x='14' y='8' width='30' height='20' rx='4' fill='%23C8A04A'/%3E%3Crect x='6' y='28' width='52' height='26' rx='8' fill='%232F5A4D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8ECE7; --text:#1C2421; --muted:#4A5550; --line:#C3CCC5;
  --leather:#23443A; --leather-2:#2F5A4D; --brass:#C8A04A; --brass-ink:#6E5310;
  --link:#1D5C8F; --focus:#9A4A00;
  --fail-bg:#FCEDEB; --fail:#A3261B; --pass-bg:#E7F4EC; --pass:#1E6A45;
  --tip-bg:#FBF4E2;
  --lvl-a:#2E6B4F; --lvl-aa:#1F5A99; --lvl-aaa:#6B3F8F;
  --code-bg:#1E2622; --code-text:#E7EEE9;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101713; --surface:#18211C; --surface-2:#222D27; --text:#E6ECE8; --muted:#A9B6AF; --line:#3A4A41;
    --leather:#1D3A31; --leather-2:#2A5244; --brass:#D6B25E; --brass-ink:#E3C47A;
    --link:#8FC6F3; --focus:#FFB86B;
    --fail-bg:#3A1C19; --fail:#FFB3AA; --pass-bg:#15301F; --pass:#9FE0B7; --tip-bg:#2E2717;
    --code-bg:#0B110E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101713; --surface:#18211C; --surface-2:#222D27; --text:#E6ECE8; --muted:#A9B6AF; --line:#3A4A41;
  --leather:#1D3A31; --leather-2:#2A5244; --brass:#D6B25E; --brass-ink:#E3C47A;
  --link:#8FC6F3; --focus:#FFB86B;
  --fail-bg:#3A1C19; --fail:#FFB3AA; --pass-bg:#15301F; --pass:#9FE0B7; --tip-bg:#2E2717;
  --code-bg:#0B110E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:5.5rem}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1.0625rem;line-height:1.6}
img,svg{max-width:100%}
a{color:var(--link);text-underline-offset:.18em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.16em}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}
.visually-hidden{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
code,kbd,pre{font-family:var(--mono);font-size:.92em}
:not(pre)>code{background:var(--surface-2);padding:.08em .35em;border-radius:4px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--surface)}
h1,h2,h3,h4{line-height:1.2;margin:0}
p{margin:0 0 1em}
.wrap{max-width:74rem;margin:0 auto;padding:0 1.25rem}
button{font:inherit;color:inherit}

/* skip link */
.skip{position:absolute;left:1rem;top:-4rem;z-index:100;background:var(--leather);color:#fff;padding:.7rem 1rem;border-radius:0 0 8px 8px;font-weight:700}
.skip:focus{top:0}

/* header */
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:1rem;min-height:4.25rem}
.logo{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.25rem;color:var(--text);text-decoration:none;letter-spacing:-.01em;flex:none}
.logo svg{width:2rem;height:2rem}
.mainnav{flex:1;overflow-x:auto;min-width:0}
.mainnav ul{display:flex;gap:.25rem;list-style:none;margin:0;padding:.25rem}
.mainnav a,.mainnav .soon{display:block;white-space:nowrap;padding:.45rem .75rem;border-radius:999px;text-decoration:none;color:var(--text);font-weight:600;font-size:.97rem}
.mainnav a:hover{background:var(--surface-2)}
.mainnav a[aria-current="page"]{background:var(--leather);color:#fff}
.mainnav a[aria-current="page"] .soon-tag{color:#DCE6E0}
.mainnav .soon-tag{font-weight:400;color:var(--muted);font-size:.85em;margin-left:.3rem}
.tools{display:flex;gap:.4rem;flex:none}
.iconbtn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem .8rem;cursor:pointer;font-weight:600;font-size:.95rem}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:1.1rem;height:1.1rem;flex:none}
@media (max-width:760px){
  .topbar .wrap{flex-wrap:wrap;gap:.25rem .75rem;padding-top:.5rem;padding-bottom:.25rem}
  .mainnav{order:3;flex-basis:100%}
  .tools{margin-left:auto}
  .iconbtn .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  html{scroll-padding-top:8.5rem}
}

main{display:block;padding-bottom:4rem}
main:focus,[tabindex="-1"]:focus{outline:none}

/* breadcrumb */
.crumbs{font-size:.95rem;padding:1.25rem 0 0}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:.35rem;margin:0;padding:0}
.crumbs li+li::before{content:"/";color:var(--muted);margin-right:.35rem}
.crumbs [aria-current]{color:var(--muted)}

/* ---------- HOME ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:2.5rem;align-items:center;padding:3.5rem 0 3rem}
.hero h1{font-size:clamp(2.8rem,7vw,5rem);font-weight:800;letter-spacing:-.035em;line-height:.95}
.hero .tag{font-size:clamp(1.2rem,2.2vw,1.5rem);font-weight:600;margin:1.1rem 0 1rem;max-width:30ch;line-height:1.3}
.hero .intro{color:var(--muted);max-width:52ch}
.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--leather);color:#fff;text-decoration:none;font-weight:700;padding:.8rem 1.25rem;border-radius:12px;border:2px solid var(--leather)}
.btn:hover{background:var(--leather-2)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn-row{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}

.wallet{position:relative;height:26rem;max-width:30rem;width:100%;justify-self:center}
.wallet .cards{list-style:none;margin:0;padding:0;position:absolute;inset:0}
.wallet .card{position:absolute;bottom:4rem;left:6%;right:6%;height:12rem;border-radius:16px;padding:.8rem 1.1rem;
  display:flex;align-items:baseline;gap:.6rem;
  transform:rotate(var(--r)) translateY(calc(var(--y) + var(--lift,0rem)));
  box-shadow:0 -1px 0 rgba(255,255,255,.35) inset,0 -6px 18px -12px rgba(0,0,0,.45);
  color:#1C2421;text-decoration:none;border:1px solid rgba(0,0,0,.14)}
.wallet .card .c-num{font-weight:800;font-size:1.5rem;line-height:1}
.wallet .card .c-name{font-weight:700;font-size:1.1rem}
.wallet .card .c-meta{font-size:.9rem;margin-left:auto}
.wallet li:nth-child(1) .card{--r:-2deg;--y:-9.6rem;background:#E8C35A;z-index:1}
.wallet li:nth-child(2) .card{--r:1.5deg;--y:-6.2rem;background:#9EC4B3;z-index:2}
.wallet li:nth-child(3) .card{--r:-1deg;--y:-3.1rem;background:#E0B3AC;z-index:3}
.wallet li:nth-child(4) .card{--r:1.8deg;--y:0rem;background:#B3C0DE;z-index:4}
.wallet a.card{transition:transform .25s ease}
.wallet a.card:hover,.wallet a.card:focus-visible{--lift:-1.1rem}
.wallet a.card:hover .c-name{text-decoration:underline;text-underline-offset:.18em}
.wallet a.card:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.pocket{position:absolute;left:0;right:0;bottom:0;height:10rem;background:var(--leather);border-radius:22px 22px 28px 28px;z-index:10;box-shadow:inset 0 3px 0 rgba(255,255,255,.08)}
.pocket::before{content:"";position:absolute;inset:.7rem;border:2px dashed var(--brass);border-radius:16px;opacity:.75}
.pocket span{position:absolute;right:1.6rem;bottom:1.3rem;color:#EFCF78;font-weight:800;letter-spacing:.02em;font-size:1.1rem}
@media (prefers-reduced-motion:no-preference){
  .wallet .card{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d) * 110ms)}
  @keyframes rise{from{transform:rotate(0deg) translateY(8rem)}to{transform:rotate(var(--r)) translateY(var(--y))}}
}
.home-sec{padding:2.5rem 0;border-top:1px solid var(--line)}
.home-sec h2{font-size:1.6rem;margin-bottom:.5rem}
.home-sec>.wrap>p{max-width:62ch;color:var(--muted)}
.chain{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;padding:0;margin:1.25rem 0 0}
.chain li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem 1rem;flex:1 1 12rem}
.chain b{display:block}
.chain span{color:var(--muted);font-size:.95rem}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.25rem}
.levels div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem}
.levels p{margin:.5rem 0 0;color:var(--muted);font-size:.97rem}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.75rem;margin:1.25rem 0 0;padding:0;list-style:none}
.toolgrid li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem}
.toolgrid p{margin:.2rem 0 0;color:var(--muted);font-size:.93rem}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:2rem}
  .wallet{height:24rem}
  .levels{grid-template-columns:1fr}
}

/* badges */
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;color:#fff;line-height:1.5;white-space:nowrap;vertical-align:middle}
.lvl-A{background:var(--lvl-a)} .lvl-AA{background:var(--lvl-aa)} .lvl-AAA{background:var(--lvl-aaa)}

/* ---------- PRINCIPLE ---------- */
.p-hero{display:grid;grid-template-columns:auto 1fr;gap:0 1.5rem;align-items:end;padding:1.5rem 0 2rem}
.p-num{font-size:clamp(5rem,14vw,9.5rem);font-weight:800;line-height:.8;color:transparent;-webkit-text-stroke:3px var(--leather-2);letter-spacing:-.05em;grid-row:span 2}
:root[data-theme="dark"] .p-num{-webkit-text-stroke-color:var(--brass)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-num{-webkit-text-stroke-color:var(--brass)}}
.p-hero h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:800;letter-spacing:-.03em}
.p-statement{font-size:1.2rem;max-width:56ch;margin:.6rem 0 0}
.p-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:center;margin-top:1.5rem;padding:1rem 1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.p-meta .counts{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.p-meta .prog{margin-left:auto;font-weight:600}
.meter{display:inline-block;width:8rem;height:.55rem;background:var(--surface-2);border-radius:99px;overflow:hidden;vertical-align:middle;margin-left:.5rem;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--leather-2)}
:root[data-theme="dark"] .meter i{background:var(--brass)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .meter i{background:var(--brass)}}
.ext{display:inline-flex;align-items:center;gap:.3rem}
.ext svg{width:.9em;height:.9em}
@media (max-width:640px){.p-hero{grid-template-columns:1fr}.p-num{grid-row:auto;font-size:5rem}.p-meta .prog{margin-left:0}}

/* tabs, styled as cards sliding out of a wallet */
.tablist{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem .25rem 0;margin:0 -.25rem;border-bottom:3px solid var(--leather-2)}
.tab{flex:1 0 12rem;max-width:22rem;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:.75rem 1rem .8rem;cursor:pointer;position:relative;top:0}
.tab:hover{background:var(--surface)}
.tab .t-id{display:block;font-weight:800;font-size:1.35rem;line-height:1.1}
.tab .t-name{display:block;font-weight:600}
.tab .t-count{display:block;font-size:.85rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--leather-2);color:#fff;border-color:var(--leather-2)}
.tab[aria-selected="true"] .t-count{color:#E3EDE7}
.tab[aria-selected="true"]::before{content:"";position:absolute;left:1rem;right:1rem;top:.35rem;height:3px;border-radius:3px;background:var(--brass)}
.tab:focus-visible{outline-offset:-5px}
.tabpanel{padding:2rem 0 0}
.tabpanel:focus-visible{outline-offset:6px}
.g-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(16rem,22rem);gap:1.5rem 2.5rem;align-items:start;margin-bottom:1.75rem}
.g-head h2{font-size:clamp(1.6rem,3.2vw,2.1rem);letter-spacing:-.02em}
.g-head .g-desc{font-size:1.12rem;margin:.6rem 0 1rem;max-width:60ch}
.g-head .g-why{color:var(--muted);max-width:64ch}
.g-aside{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem}
.g-aside h3{font-size:1rem;margin-bottom:.5rem}
.g-aside ul{margin:0;padding-left:1.1rem}
.g-aside li{margin:.2rem 0}
.g-aside .links{margin-top:.8rem;display:flex;flex-direction:column;gap:.3rem;font-size:.95rem}
@media (max-width:860px){.g-head{grid-template-columns:1fr}}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem;padding:.75rem 0;margin-bottom:1rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.toolbar .grp{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.toolbar .grp-label{font-weight:600;margin-right:.2rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .8rem;cursor:pointer;font-weight:600;font-size:.93rem;display:inline-flex;align-items:center;gap:.35rem}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .tick{width:.9rem;height:.9rem}
.chip[aria-pressed="false"] .tick{visibility:hidden}
.toolbar .status{color:var(--muted);font-size:.95rem}
.toolbar .spacer{flex:1}

/* success criterion accordion */
.sc-list{display:flex;flex-direction:column;gap:.9rem}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sc.is-open{border-color:var(--leather-2);box-shadow:0 0 0 1px var(--leather-2)}
.sc-h{font-size:inherit}
.sc-toggle{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:.4rem 1rem;width:100%;padding:1rem 1.2rem;cursor:pointer}
.sc-toggle:focus-visible{outline:3px solid var(--focus);outline-offset:-4px;border-radius:14px}
.sc-toggle:hover .sc-title{text-decoration:underline;text-underline-offset:.2em}
.sc-num{font-family:var(--mono);font-weight:600;font-size:1rem;background:var(--surface-2);border-radius:6px;padding:.2rem .5rem}
.sc-title{font-size:1.2rem;font-weight:700}
.sc-flags{display:flex;gap:.4rem;align-items:center}
.learned-flag{font-size:.8rem;font-weight:700;color:var(--pass);border:1.5px solid currentColor;border-radius:999px;padding:.05rem .5rem;display:inline-flex;align-items:center;gap:.25rem}
.learned-flag svg{width:.8rem;height:.8rem}
.chev{width:1.4rem;height:1.4rem;transition:transform .2s ease}
.sc-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sc-sum{margin:0;padding:0 1.2rem 1rem;color:var(--muted);max-width:75ch}
@media (max-width:600px){.sc-toggle{grid-template-columns:auto 1fr auto}.sc-flags{grid-column:1/-1;grid-row:3}.sc-title{grid-column:1/-1;grid-row:2}.chev{grid-row:1;grid-column:3}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

.sc-body{border-top:1px dashed var(--line);padding:1.5rem 1.2rem 1.75rem}
.sc-links{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;margin-bottom:1.5rem;font-size:.97rem}
.sec{margin:0 0 1.9rem;max-width:78ch}
.sec.wide{max-width:none}
.sec h4{font-size:1.1rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
.sec h4 svg{width:1.15rem;height:1.15rem;color:var(--leather-2);flex:none}
:root[data-theme="dark"] .sec h4 svg{color:var(--brass)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec h4 svg{color:var(--brass)}}
.sec ul,.sec ol{margin:0;padding-left:1.25rem}
.sec li{margin:.35rem 0}
.sec li::marker{color:var(--muted)}
.lead{font-size:1.1rem}
.who{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;padding:0 !important}
.who li{margin:0;background:var(--surface-2);border-radius:8px;padding:.35rem .7rem;font-size:.95rem}

.checklist{list-style:none;padding:0 !important}
.checklist li{margin:0;border-bottom:1px solid var(--line)}
.checklist li:last-child{border-bottom:0}
.checklist label{display:grid;grid-template-columns:auto 1fr;gap:.75rem;padding:.55rem .25rem;cursor:pointer;align-items:start}
.checklist input{width:1.25rem;height:1.25rem;margin:.2rem 0 0;accent-color:var(--leather-2)}
.checklist input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.check-count{font-weight:400;font-size:.9rem;color:var(--muted);margin-left:auto}

.steps{counter-reset:step;list-style:none;padding:0 !important}
.steps li{counter-increment:step;display:grid;grid-template-columns:2rem 1fr;gap:.75rem;margin:.6rem 0}
.steps li::before{content:counter(step);font-weight:800;display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;border:2px solid var(--leather-2);font-size:.95rem}

.toolchips{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;padding:0 !important}
.toolchips li{margin:0}
.toolchips a,.toolchips span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:.3rem .7rem;font-size:.95rem;background:var(--surface)}

.fails li{margin:.55rem 0}
.fcode{font-family:var(--mono);font-weight:600;font-size:.88rem;margin-right:.35rem}
.fails .scenario{list-style:none;padding:0 !important}
.fails .scenario li{border-left:3px solid var(--fail);padding:.35rem 0 .35rem .8rem;background:var(--fail-bg);border-radius:0 8px 8px 0;margin:.45rem 0}
.fails .scenario li strong{color:var(--fail)}

.examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:1rem}
.ex{border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--surface);min-width:0}
.ex-h{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;font-weight:700}
.ex-h svg{width:1.05rem;height:1.05rem}
.ex.bad .ex-h{background:var(--fail-bg);color:var(--fail)}
.ex.good .ex-h{background:var(--pass-bg);color:var(--pass)}
.ex p{margin:0;padding:.6rem .9rem;font-size:.95rem;color:var(--muted)}
pre{margin:0;background:var(--code-bg);color:var(--code-text);padding:1rem;overflow:auto;line-height:1.5;font-size:.86rem;tab-size:2}
pre:focus-visible{outline-offset:-3px}
.auto pre{border-radius:12px}
.auto-note{font-size:.95rem;color:var(--muted);margin:.6rem 0 0}

.techs{columns:2 18rem;column-gap:2rem}
.techs li{break-inside:avoid}
.callout{border-radius:12px;padding:1rem 1.1rem;background:var(--tip-bg);border:1px solid var(--line)}
.callout h4{margin-bottom:.35rem}
.callout p:last-child{margin:0}

.learn-row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;padding-top:1.25rem;border-top:1px solid var(--line)}
.learn{border:2px solid var(--leather-2);background:transparent;border-radius:10px;padding:.55rem 1rem;cursor:pointer;font-weight:700;display:inline-flex;gap:.45rem;align-items:center}
.learn svg{width:1.1rem;height:1.1rem}
.learn[aria-pressed="true"]{background:var(--leather-2);color:#fff}

<script>
/* =========================================================
   a11ywallet data
   To add a principle later: fill its guidelines[].criteria
   with objects shaped like the Perceivable ones and remove
   "soon: true". Everything else renders automatically.
   ========================================================= */
const TOOLS = {
  axe:{name:"axe DevTools", url:"https://www.deque.com/axe/devtools/", note:"Automated rules engine in a browser extension. Fast first pass, zero false positives by design."},
  wave:{name:"WAVE", url:"https://wave.webaim.org/extension/", note:"Overlays icons on the page for alt text, structure, contrast and ARIA."},
  ai:{name:"Accessibility Insights", url:"https://accessibilityinsights.io/", note:"Guided manual assessment plus visualisers for headings, landmarks and tab stops."},
  devtools:{name:"Chrome DevTools Accessibility pane", url:"https://developer.chrome.com/docs/devtools/accessibility/reference", note:"Shows the computed accessible name, role and the full accessibility tree."},
  nvda:{name:"NVDA (Windows)", url:"https://www.nvaccess.org/download/", note:"Free screen reader. Pair with Chrome or Firefox."},
  vo:{name:"VoiceOver (macOS / iOS)", url:"https://support.apple.com/guide/voiceover/welcome/mac", note:"Built-in screen reader. Pair with Safari."},
  cca:{name:"Colour Contrast Analyser", url:"https://www.tpgi.com/color-contrast-checker/", note:"Desktop eyedropper for any pixel, including text over images and borders."},
  webaim:{name:"WebAIM Contrast Checker", url:"https://webaim.org/resources/contrastchecker/", note:"Paste two hex values and read the ratio."},
  linkcontrast:{name:"WebAIM Link Contrast Checker", url:"https://webaim.org/resources/linkcontrastchecker/", note:"Checks link colour against body text and background together."},
  webdev:{name:"Web Developer extension", url:"https://chrispederick.com/work/web-developer/", note:"Disable CSS, show alt text, outline elements."},
  andi:{name:"ANDI", url:"https://www.ssa.gov/accessibility/andi/help/install.html", note:"Bookmarklet that lists accessible names, tables and structure."},
  spacing:{name:"Text spacing bookmarklet", url:"https://www.html5accessibility.com/tests/tsbookmarklet.html", note:"Applies the exact WCAG 1.4.12 spacing values in one click."},
  alttree:{name:"W3C alt decision tree", url:"https://www.w3.org/WAI/tutorials/images/decision-tree/", note:"Decide what an image's alt should be."},
  rendering:{name:"DevTools Rendering: emulate vision deficiencies", url:"https://developer.chrome.com/docs/devtools/rendering/emulate-css", note:"Preview the page in greyscale or colour-blind simulations."},
  headings:{name:"HeadingsMap extension", url:"", note:"Shows the heading outline of the page."},
  zoom:{name:"Browser zoom (Ctrl/Cmd +)", url:"", note:"Built in. Firefox also offers View > Zoom > Zoom Text Only."},
  device:{name:"Real phone or tablet", url:"", note:"Rotate, pinch-zoom and test with the mobile screen reader."},
  player:{name:"The media player itself", url:"", note:"Toggle captions, audio description and transcript controls."}
};

const TECH_DIR = {H:"html", G:"general", ARIA:"aria", C:"css", F:"failures", SCR:"client-side-script"};

const PERCEIVABLE_GUIDELINES = [
/* ------------------------------------------------------ 1.1 */
{
  id:"1.1", name:"Text Alternatives", slug:"text-alternatives",
  desc:"Give every piece of non-text content a text alternative, so it can be turned into whatever form a person needs: speech, braille, large print, symbols or simpler language.",
  why:"Text is the most flexible format there is. Once an image, icon or control has a good text equivalent, assistive technology can present it in any way the user needs. Without it, that content simply does not exist for a screen reader or braille user.",
  kit:["Alt text in context, not in isolation","Accessible names of icon-only buttons and links","Decorative images hidden from assistive tech","Charts and infographics with long descriptions"],
  criteria:[
  {
    id:"1.1.1", title:"Non-text Content", slug:"non-text-content", level:"A",
    kw:"alt text image icon svg captcha decorative logo chart button name",
    s:"Every image, icon, graphical control and other non-text item has a text alternative that serves the same purpose. Purely decorative items are hidden from assistive technology.",
    intent:"Think about what the non-text content does, not what it looks like. The text alternative should let someone who cannot see it get the same information or perform the same action. WCAG splits non-text content into categories, and each one needs something slightly different: controls and inputs need a name that describes their purpose; time-based media and tests need at least a descriptive label; sensory experiences (a painting, a music sample) need a descriptive identification; CAPTCHAs need a description of their purpose plus an alternative form in another sense; and decoration, formatting or invisible content must be implemented so assistive technology can ignore it.",
    who:["Blind screen reader users","Braille display users","Low-vision users using text-to-speech","People with cognitive disabilities who benefit from text","Anyone with images blocked or on a slow connection"],
    check:[
      "Every <img>, <input type=\"image\"> and <area> has an alt attribute",
      "Informative images: alt conveys the meaning or information, not a visual description of pixels",
      "Functional images (inside links or buttons): alt describes the action or destination, e.g. “Search”, not “magnifying glass”",
      "Decorative images use alt=\"\" (or are CSS backgrounds) so they are skipped",
      "Icon-only buttons and links have an accessible name (visible text, visually hidden text, aria-label or aria-labelledby)",
      "Inline <svg> that carries meaning has role=\"img\" with a <title> or aria-label; decorative SVG has aria-hidden=\"true\"",
      "Complex images (charts, diagrams, maps, infographics) have a short alt plus a longer description on the page or linked",
      "Images of text have alt that contains the same text",
      "Alt text is not the filename, a placeholder (“image”, “photo”, “IMG_2034”) or keyword stuffing",
      "Alt does not repeat adjacent visible text word for word (use alt=\"\" when a caption or link text already says it)",
      "CAPTCHA has a text description of its purpose and an alternative in another modality (audio, or a non-CAPTCHA route)",
      "CSS background images that convey information also have a text equivalent",
      "Text alternatives update when the image changes (carousels, state icons, dynamic charts)"
    ],
    how:[
      "Run axe or WAVE to catch images with no alt at all, empty buttons and empty links. This is only the floor: tools cannot judge whether the alt is any good.",
      "List every image with its alt, for example with WAVE's details panel or Web Developer > Images > Display Alt Attributes. Read each alt in context and ask: if the image vanished, would this text do the same job?",
      "Check icon-only controls in the DevTools Accessibility pane. The Computed Properties > Name field must describe the action.",
      "Turn off images (or CSS) and read the page. Anything you can no longer understand or operate is a failure.",
      "Use a screen reader. In NVDA press G to jump between graphics; in VoiceOver use the rotor's Images list. Listen for “unlabelled graphic”, file names, or decorative images being announced.",
      "For charts and infographics, confirm that the data or key takeaway is available as text (a table, a summary paragraph, or a linked description).",
      "For CAPTCHAs, try completing the flow with only a keyboard and screen reader, and check an alternative modality exists."
    ],
    tools:["axe","wave","devtools","nvda","vo","webdev","alttree","andi"],
    fails:[["F30","Alt text is not really an alternative, such as a filename or placeholder"],["F65","No alt, aria-label, aria-labelledby or title on an image"],["F39","Decorative image given non-empty alt, adding noise"],["F38","Decorative image not marked up so AT can ignore it"],["F3","CSS used to insert an image that conveys important information"],["F20","Text alternative not updated when the non-text content changes"],["F71","Look-alike characters used in place of letters with no text alternative"],["F72","ASCII art with no text alternative"]],
    scenarios:[
      ["Icon button with no name","A cart icon button reads as just “button” in the screen reader."],
      ["Alt describes the picture, not the purpose","A logo linking home has alt=\"green leaf logo\" instead of “Acme home”."],
      ["Chart with only a title","A revenue bar chart has alt=\"Chart\" and the numbers appear nowhere as text."],
      ["Redundant alt","A product card has an image alt=\"Blue hoodie\" directly above a link reading “Blue hoodie”, so the name is read twice."]
    ],
    ex:{
      bad:String.raw`<a href="/cart"><img src="cart.svg"></a>

<button class="icon-btn">
  <svg viewBox="0 0 24 24"><path d="M3 6h18..."/></svg>
</button>

<img src="IMG_2034.jpg" alt="IMG_2034.jpg">
<img src="divider-swirl.png" alt="swirl divider">`,
      badNote:"No names for the link and button, a filename as alt, and a decorative image that will be announced.",
      good:String.raw`<a href="/cart"><img src="cart.svg" alt="Cart, 2 items"></a>

<button class="icon-btn" aria-label="Open menu">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M3 6h18..."/>
  </svg>
</button>

<img src="team.jpg" alt="Support team of five at the Kochi office">
<img src="divider-swirl.png" alt="">

<figure>
  <img src="q3-revenue.png" alt="Bar chart of Q3 revenue by region. Details follow.">
  <figcaption>APAC grew 18%, EU 9%, US 4%.</figcaption>
</figure>`,

  summary:"A vertical stack of headings, each containing a button that shows or hides a panel of content.",
  what:"An accordion packs a lot of content into a small space without long scrolling. Think FAQs, filter groups, or a multi-section form. Each heading holds a button; activating it reveals or hides the panel below.",
  parts:[["Accordion header","The title that controls a panel. It's a button inside a heading element (h2, h3 and so on). Activating it shows or hides its panel."],["Accordion panel","The block of content tied to a header. It's shown or hidden according to the header's state."]],
  demo:"accordion",
  demoNote:"This demo lets more than one panel be open, and every header can collapse its own panel. APG allows other designs too (only one open at a time, or one panel always open). Whichever is chosen must be consistent and predictable.",
  keyboard:[["Enter or Space","On a collapsed header: expands its panel (and, in one-at-a-time designs, collapses the previously open one). On an expanded header: collapses it, if the design allows collapsing."],["Tab","Moves to the next focusable element. Every header button is in the normal page tab order; there's no trapping."],["Shift + Tab","Moves to the previous focusable element."],["Down / Up Arrow (optional)","Moves focus to the next / previous header, wrapping at the ends."],["Home / End (optional)","Moves focus to the first / last header."]],
  kbNote:"Only Enter, Space, Tab and Shift+Tab are required. APG lists arrow keys, Home and End as optional extras, so don't fail an accordion for lacking them. Arrow keys are required in patterns like Tabs and Menus.",
  roles:[
    ["Header text","A real heading element (h2, h3…) at a level that fits the page outline","Lets screen reader users jump between headers with heading navigation, like any other heading."],
    ["Header control","A <button> element (or role=\"button\")","Announced as something to activate, not plain text. The heading must contain only the button."],
    ["Header button","aria-expanded=\"true\" or \"false\"","Communicates open or closed state; must stay in sync with what's shown."],
    ["Header button","aria-controls=\"panel-id\"","Points to the panel this button shows and hides."],
    ["Header button (rare)","aria-disabled=\"true\"","Only when the panel is expanded and the design doesn't allow collapsing it."],
    ["Panel","role=\"region\" with aria-labelledby=\"header-id\" (optional)","Makes the open panel a named landmark users can jump to. Avoid it when about six or more panels can be open at once, to prevent landmark clutter."]
  ],
  code:[
    {label:"Markup for one header and panel", code:String.raw`<h3>
  <button type="button"
          aria-expanded="false"
          aria-controls="panel-1"
          id="header-1">
    What is WCAG?
  </button>
</h3>
<div id="panel-1"
     role="region"
     aria-labelledby="header-1"
     hidden>
  <p>WCAG is the W3C standard for accessible web content...</p>
</div>`},
    {label:"Minimal toggle script", code:String.raw`button.addEventListener('click', () => {
  const expanded = button.getAttribute('aria-expanded') === 'true';
  button.setAttribute('aria-expanded', String(!expanded));
  panel.hidden = expanded;   // show when it was collapsed, and vice versa
});`, note:"The hidden attribute hides the panel from everyone, including screen readers, with no CSS. display:none via a class works too. Never hide content only visually (like opacity:0) while it's still exposed to assistive tech, or the other way round."}
  ],
  mistakes:[
    ["A div or span as the header","Not focusable or operable by keyboard and announces no role. It must be a real <button> (or role=\"button\" with tabindex and key handling)."],
    ["Missing or stale aria-expanded","If it's missing or doesn't update, screen reader users get no state, or the wrong one."],
    ["Button not inside a heading, or heading wraps more than the button","Breaks heading navigation, or buries the button's name among other content."],
    ["No visible focus indicator","Removing the outline with no replacement fails 2.4.7 Focus Visible."],
    ["Hidden panel content still in the tab order","If a panel is only visually hidden, its links and inputs still receive focus, so keyboard users land on invisible controls."]
  ],
  good:"Heading + button + aria-expanded + aria-controls, all kept in sync, is what makes the pattern understandable to assistive technology.",
  wcag:[["4.1.2","The header exposes a name, the button role, and its expanded or collapsed state."],["2.1.1","Everything works by keyboard alone."],["2.4.7","Focus on each header is visible."],["2.4.3","Tab order through headers and panel content is logical."],["1.3.1","Heading structure and the header–panel relationship are in the code, not only visual."]],
  quiz:[
    {q:"Which keys must an accordion support to meet the APG pattern?", o:["Arrow keys, Home and End","Enter, Space, Tab and Shift+Tab","Only Tab"], a:1, e:"Enter/Space toggle a header and Tab/Shift+Tab move between focusable elements. Arrow keys, Home and End are optional."},
    {q:"When should you avoid role=\"region\" on accordion panels?", o:["Always; it's not allowed","When about six or more panels can be open at the same time","When the accordion has headings"], a:1, e:"Many open regions create landmark clutter. APG suggests avoiding region roles in that case."}
  ],
  recap:"An accordion is a heading-wrapped button that toggles a connected panel through aria-expanded and aria-controls. It needs only Tab and Enter/Space, must keep its state accurate at all times, and can give open panels a region landmark where that doesn't cause clutter."
},

/* ---------------------------------------------------------- alert */
alert:{
  name:"Alert", apg:APG+"alert/", example:APG+"alert/examples/alert/",
  kw:"alert role alert live region assertive announcement status message toast",
  summary:"An important, usually time-sensitive message that's announced without moving focus or interrupting the user's task.",
  what:"An alert grabs attention without interrupting what the user is doing: “Your changes were saved”, “Session expiring in 2 minutes”, “That field is required”. Most screen readers announce alert content automatically the moment it appears, with no click or focus change.",
  parts:[["Focus never moves","An alert must not steal keyboard focus. The user keeps working where they were; the message is simply announced."],["No keyboard interaction","There's nothing to operate. If the user must respond, or focus has to move, use the Alert Dialog pattern instead."]],
  callout:{title:"Important limitation", text:"Screen readers don't announce alerts that are already in the page before it finishes loading. Insert or update the alert's content with script after load."},
  demo:"alert",
  demoNote:"Clicking a button doesn't move focus and nothing pops up over the page. The message appears and screen readers speak it straight away, while focus stays on the button you clicked.",
  keyboard:[["None","Alerts have no keyboard interaction. There's nothing to Tab to or activate in the alert container itself."]],
  kbNote:"If an alert contains buttons (like Undo or Dismiss) that's fine, as long as focus wasn't forced there automatically.",
  roles:[
    ["Message container","role=\"alert\"","Marks the element where alert content is added or updated. It's the only attribute you need to add."],
    ["Message container","aria-live=\"assertive\" (implicit)","Built into role=\"alert\". Tells assistive tech to interrupt and announce the change immediately."],
    ["Message container","aria-atomic=\"true\" (implicit)","Also built in. The whole alert is read, not just the changed part."]
  ],
  rolesNote:"Adding aria-live=\"assertive\" and aria-atomic=\"true\" by hand is redundant but harmless. The one thing you must add is role=\"alert\".",
  code:[
    {label:"Empty container present on page load", code:String.raw`<div id="live-alert" role="alert"></div>`},
    {label:"Script that inserts a message after load", code:String.raw`function showAlert(message) {
  const container = document.getElementById('live-alert');
  // Changing content AFTER load triggers the announcement.
  container.textContent = message;
}

showAlert('Your changes have been saved.');`, note:"The container is already a live region before the update, so the accessibility tree notices the change. If you create a brand-new role=\"alert\" element each time, some screen readers miss the announcement."}
  ],
  mistakes:[
    ["Alert text present at page load","If the role=\"alert\" element has its final text in the initial HTML, most screen readers never announce it."],
    ["Moving focus into the alert","That turns a non-interrupting message into something else. If focus must move, it's an alert dialog."],
    ["Alerts that disappear on a timer","A message that vanishes before people can read it can fail 2.2.1 Timing Adjustable (APG also points to 2.2.3). Let users dismiss it themselves, or keep it visible."],
    ["Using alerts for routine messages","Assertive announcements interrupt whatever is being read. Use role=\"status\" (polite) for routine confirmations and keep role=\"alert\" for important, time-sensitive information."]
  ],
  good:"Keep one empty role=\"alert\" container in the DOM from page load and swap its text with script when needed.",
  wcag:[["4.1.3","Status messages must reach assistive technology without a focus change, which is exactly what role=\"alert\" (or role=\"status\") provides."],["4.1.2","The container exposes the right role so changes are programmatically determinable."],["2.2.1","If the alert disappears automatically, users need a way to adjust or turn off that time limit."],["2.2.4","Users should be able to postpone or suppress non-essential interruptions, including frequent alerts (AAA)."],["3.2.1","An alert must not move focus; check that it wasn't implemented as a focus change anyway."]],
  quiz:[
    {q:"An alert's text is in the HTML when the page loads. What happens?", o:["It's announced as soon as the page loads","Most screen readers never announce it","It's announced twice"], a:1, e:"Screen readers only announce changes to live regions after the page has loaded."},
    {q:"Which attributes must you add by hand for a basic alert?", o:["role=\"alert\" only","role=\"alert\", aria-live and aria-atomic","aria-live=\"polite\""], a:0, e:"role=\"alert\" implies aria-live=\"assertive\" and aria-atomic=\"true\"."}
  ],
  recap:"An alert is a role=\"alert\" container whose content changes after page load, so screen readers announce it straight away: no focus movement, no keyboard interaction, and no extra ARIA beyond the role. Reserve it for important, time-sensitive messages, never let it vanish before people can read it, and never let it steal focus."
},

/* ---------------------------------------------------------- alertdialog */
alertdialog:{
  name:"Alert and Message Dialogs", apg:APG+"alertdialog/", example:APG+"alertdialog/examples/alertdialog/",
  kw:"alertdialog alert dialog modal confirmation aria-modal focus trap escape aria-describedby destructive",
  summary:"A modal dialog that interrupts the user to communicate an important message and requires a response.",
  what:"An alert dialog interrupts the workflow to deliver an important message and get a response before the user continues: “Are you sure you want to delete this?” or “Unsaved changes will be lost — continue?”. It's a modal dialog with role=\"alertdialog\" instead of role=\"dialog\", which lets assistive technology treat it as urgent, for example by playing a system alert sound.",
  callout:{title:"alertdialog vs dialog", text:"Structurally they behave the same (focus moves in, Tab cycles inside, Escape closes). The difference is the role and the urgency it signals. Use alertdialog only when the message is critical and needs acknowledgement, not for routine dialogs like “Edit profile”."},
  compare:{
    caption:"Alert, alert dialog and modal dialog compared",
    head:["","Alert (role=\"alert\")","Alert dialog (role=\"alertdialog\")","Modal dialog (role=\"dialog\")"],
    rows:[
      ["Interrupts the workflow?","No; announced passively","Yes; blocks the page until resolved","Yes; blocks the page until closed"],
      ["Moves keyboard focus?","Never","Always, into the dialog","Always, into the dialog"],
      ["Needs a response?","No","Yes: confirm, cancel or acknowledge","Depends on the content"],
      ["Typical use","“Your changes have been saved.”","“Discard all your notes? This can't be undone.”","Forms, settings, a date picker grid"]
    ],
    note:"“Dialog” describes the container behaviour (modal, focus kept inside, Escape to close). What goes inside it (a message, a form, a calendar grid) and how urgent it is (alertdialog or dialog) are separate decisions layered on the same base pattern."
  },
  demo:"alertdialog",
  demoNote:"While the confirmation is open: focus starts on “No” (the safer choice), Tab and Shift+Tab cycle only between No and Yes, Escape closes it (same as No), and closing returns focus to “Discard”. This demo uses the native <dialog> element opened with showModal(), which makes the background inert, with role=\"alertdialog\" on it.",
  sections:[
    {id:"initial-focus", title:"Initial focus: the safety rule", html:"<p>When an alert dialog opens, focus moves inside it. Which element gets it is a deliberate choice. <b>Put initial focus on the least destructive option.</b> In the demo, focus lands on “No”, not “Yes”, so a reflexive Enter or Space cancels rather than triggering something irreversible. This protects keyboard and screen reader users, and anyone who presses Enter out of habit.</p>"},
    {id:"aria-modal", title:"aria-modal vs aria-hidden", html:"<p><code>aria-modal=\"true\"</code> tells assistive technology that everything behind the dialog is inert. It's a serious commitment. Only set it when <b>both</b> are true: the code really prevents interaction with everything outside the dialog, and the styling (such as a dimmed overlay) visually obscures it. If a dialog claims to be modal but sighted mouse users can still use the page behind it, screen reader users are told the background is unreachable when it isn't.</p><p>Older implementations used <code>aria-hidden=\"true\"</code> on the rest of the page instead. If you meet that legacy technique: every element covering the background needs its own <code>aria-hidden=\"true\"</code>, and the dialog must not be inside any element with <code>aria-hidden=\"true\"</code>, or it hides itself. Today the native <code>&lt;dialog&gt;</code> element with <code>showModal()</code>, or the <code>inert</code> attribute, is the simplest reliable approach.</p>"}
  ],
  keyboard:[["Tab","Moves to the next focusable element inside the dialog; from the last, wraps to the first."],["Shift + Tab","Moves to the previous focusable element; from the first, wraps to the last."],["Escape","Closes the dialog (equivalent to the least destructive or cancel option)."]],
  kbNote:"While the dialog is open, focus must never reach the page behind it. That is intended and fine; it doesn't fail 2.1.2 No Keyboard Trap because Escape and the dialog's buttons always provide a way out.",
  roles:[
    ["Dialog container","role=\"alertdialog\"","Identifies an alert dialog, distinct from a plain dialog, so assistive tech can treat it as urgent."],
    ["Dialog container","aria-modal=\"true\"","Declares the rest of the page inert while open (implied when using <dialog> with showModal()). See the warning above."],
    ["Dialog container","aria-labelledby=\"title-id\" (or aria-label)","The accessible name, usually the visible heading such as “Confirmation”."],
    ["Dialog container","aria-describedby=\"message-id\"","Points to the element with the actual message, so it's announced after the name. APG calls this out specifically for alert dialogs."],
    ["Buttons in the app that are temporarily unavailable","aria-disabled=\"true\" (instead of the disabled attribute)","Keeps the button discoverable in the tab order so screen reader users know it exists and why it's unavailable. Used for Save and Discard in the APG example."]
  ],
  code:[
    {label:"Markup", code:String.raw`<dialog id="confirm" role="alertdialog"
        aria-labelledby="ad-title" aria-describedby="ad-desc">
  <h2 id="ad-title">Confirmation</h2>
  <p id="ad-desc">Are you sure you want to discard all of your notes?</p>
  <button type="button" id="ad-no">No</button>
  <button type="button" id="ad-yes">Yes</button>
</dialog>`},
    {label:"Open, focus the safe option, return focus on close", code:String.raw`const dialog = document.getElementById('confirm');
let opener;

discardBtn.addEventListener('click', () => {
  opener = document.activeElement;
  dialog.showModal();                           // background becomes inert
  document.getElementById('ad-no').focus();     // least destructive first
});

dialog.addEventListener('close', () => opener?.focus());  // Escape fires close too`}
  ],
  mistakes:[
    ["aria-modal=\"true\" without real modality","The most damaging defect: assistive tech users are told the background is unreachable while others can still use it."],
    ["Missing aria-describedby","The dialog announces its title but not the question, so users must hunt for what they're confirming."],
    ["No accessible name","Neither aria-labelledby nor aria-label, so the dialog is announced without a name."],
    ["Focus lands on the destructive button","Defaulting to “Yes”, “Delete” or “Confirm” invites accidental irreversible actions."],
    ["Focus not moved in, or not returned on close","Focus stays behind the dialog when it opens, or ends up at the top of the page when it closes."],
    ["Focus escapes the dialog","Tab eventually reaches the page underneath instead of cycling inside."],
    ["Escape doesn't close it","A widely expected shortcut is missing."],
    ["alertdialog used for routine content","Overuse dilutes the urgency signal. If nothing needs a decision, use an alert or a plain dialog."]
  ],
  good:"role=\"alertdialog\", a real modal (inert background), aria-labelledby and aria-describedby, focus on the safest option, Tab kept inside, Escape to close, and focus returned to the trigger.",
  wcag:[["4.1.2","The dialog exposes its role, a name (title) and a description (the message)."],["2.1.1","Confirm, cancel and close all work by keyboard."],["2.1.2","Keeping focus inside is fine, as long as Escape or the buttons always let users out."],["2.4.3","Focus moves into the dialog on open, cycles logically, and returns to the trigger on close."],["3.2.1","Opening the dialog is an intended change of context from activation; nothing else unexpected should happen just from focus moving within it."],["3.3.4","A confirmation step before destructive or financial actions is one way to meet error prevention."]],
  quiz:[
    {q:"Which attribute does APG specifically call for on an alertdialog, pointing to the message?", o:["aria-modal","aria-describedby","tabindex=\"0\""], a:1, e:"The alertdialog has aria-describedby referring to the element that contains the alert message."},
    {q:"Why does initial focus go to “No” rather than “Yes” in the discard example?", o:["It's alphabetically first","It's the least destructive action, so a reflexive Enter cancels","Screen readers require the left-most button"], a:1, e:"Putting focus on the safest option prevents accidental irreversible actions."},
    {q:"Is aria-modal=\"true\" enough on its own to make a dialog modal?", o:["Yes","No"], a:1, e:"It only tells assistive technology. The code must also block interaction with the background, and the styling must obscure it."}
  ],
  recap:"An alert dialog is a modal dialog with role=\"alertdialog\" that interrupts the user to demand a response. Its name and message are wired with aria-labelledby and aria-describedby. Focus moves in, ideally to the least destructive option, stays inside while open, Escape closes it, and focus returns to the trigger. Use it only when a real decision is needed."
}
};
/* ---------- more APG patterns (merged into APG_PATTERNS) ---------- */
Object.assign(APG_PATTERNS, {

/* ============================== breadcrumb */
breadcrumb:{
  name:"Breadcrumb", apg:APG+"breadcrumb/", example:APG+"breadcrumb/examples/breadcrumb/",
  kw:"breadcrumb trail nav aria-current page location hierarchy separator",
  summary:"A list of links to the parent pages of the current page, in hierarchical order, inside a labelled navigation landmark.",
  what:"A breadcrumb trail shows where the current page sits in the site's hierarchy, from the top-level page down to the current one, and lets users jump back up in one click. It usually sits horizontally just above the main content. It's one of the simplest APG patterns: an ordered list of links in a labelled nav landmark, with one ARIA attribute.",
  callout:{title:"Good news for auditors", text:"There's no keyboard interaction to test and no focus management. It's all about correct semantic structure."},
  demos:[{kind:"breadcrumb", title:"Breadcrumb trail", note:"The separators between items are pure CSS; they don't exist in the HTML, so screen readers never announce them. This demo's nav is labelled “Example breadcrumb” only because this page already has a real “Breadcrumb” nav at the top, and landmark labels should be unique. Use the button to see roughly what a screen reader announces."}],
  sections:[{id:"separators", title:"Why an ordered list, and why CSS separators", html:"<ul><li><b>&lt;ol&gt;, not &lt;ul&gt;:</b> the sequence is meaningful. It reflects the hierarchy from the top-level page down to the current one.</li><li><b>Separators (›, /, &gt;) in CSS only:</b> the labelled nav and the ordered list already convey the structure. Typing a separator character into the HTML makes screen readers announce “greater than” or “slash” between every link, for no benefit. The APG example draws its separators with a CSS border.</li></ul>"}],
  keyboard:[["Tab / Shift + Tab","Moves between the breadcrumb links, like any other links."],["Enter","Follows the focused link."]],
  kbNote:"APG lists keyboard interaction as not applicable: breadcrumbs are ordinary links, so the browser provides everything.",
  roles:[
    ["Wrapper","<nav> (implicit role=\"navigation\")","Makes the trail a navigation landmark users can jump to."],
    ["Wrapper","aria-label=\"Breadcrumb\" (or aria-labelledby)","Distinguishes it from other nav landmarks on the page, such as the main menu or footer links."],
    ["List","<ol> with <li> items","Conveys that the items form an ordered sequence, and gives the “list, 4 items” announcement."],
    ["Current page link","aria-current=\"page\"","Marks the “you are here” item. Only the last item gets it. Optional if the current item isn't a link."]
  ],
  code:[{label:"Markup", code:String.raw`<nav aria-label="Breadcrumb" class="breadcrumb">
  <ol>
    <li><a href="/">APG</a></li>
    <li><a href="/patterns/">Patterns</a></li>
    <li><a href="/patterns/breadcrumb/">Breadcrumb Pattern</a></li>
    <li><a href="/patterns/breadcrumb/examples/" aria-current="page">Breadcrumb Example</a></li>
  </ol>
</nav>`},
  {label:"Separators drawn with CSS", code:String.raw`.breadcrumb li + li::before {
  content: "";
  display: inline-block;
  width: .45em; height: .45em;
  border-top: 2px solid currentColor;
  border-right: 2px solid currentColor;
  transform: rotate(45deg);
  margin: 0 .6em;
}`}],
  mistakes:[
    ["No nav landmark","The breadcrumb is a loose row of links, so landmark navigation can't find it."],
    ["Missing or duplicate label","An unlabelled nav is indistinguishable from other nav landmarks in a landmarks list."],
    ["No aria-current=\"page\"","Bold styling shows the current page visually, but assistive tech gets nothing."],
    ["aria-current on more than one item","Or on an item that isn't the current page."],
    ["Separators typed into the HTML","Screen readers read “greater than” or “slash” between every link."],
    ["Not a real list","Links placed straight in the nav, or div/span “lists”, lose the item count and sequence."],
    ["Current item links to itself (best practice)","A self-referencing link adds a pointless stop. Plain text is fine; aria-current then becomes optional."]
  ],
  good:"A <nav aria-label=\"Breadcrumb\"> containing an <ol> of links, with aria-current=\"page\" on the last item and separators drawn in CSS.",
  wcag:[["1.3.1","The ordered sequence is conveyed by a real list, not just visually."],["4.1.2","The landmark's name and the current-page state are exposed."],["2.4.8","Breadcrumbs are a direct way to show location (AAA)."],["2.4.1","A labelled navigation landmark is one of the ways users can move around blocks of content."]],
  quiz:[
    {q:"Which item gets aria-current=\"page\"?", o:["The first item","Every item","The last item, the current page"], a:2, e:"It marks the single “you are here” point. If that item isn't a link, it's optional."},
    {q:"Why are separators added with CSS instead of typed into the HTML?", o:["CSS loads faster","To stop screen readers announcing a separator between every link","HTML doesn't support the > character"], a:1, e:"The labelled nav and ordered list already convey the structure; typed separators just add noise."},
    {q:"Does the breadcrumb pattern need custom keyboard handling?", o:["Yes, arrow keys between crumbs","No"], a:1, e:"Keyboard interaction is not applicable. They're ordinary links."}
  ],
  recap:"A breadcrumb is a labelled <nav> containing an ordered list of links, with the current page marked by aria-current=\"page\". There's no keyboard handling to build. Separators belong in CSS, because the list and landmark already tell screen reader users how the trail is organised."
},

/* ============================== button */
button:{
  name:"Button", apg:APG+"button/", example:APG+"button/examples/button/",
  kw:"button toggle aria-pressed command div role button enter space focus after activation idl reflection",
  summary:"A widget that triggers an action or event, such as submitting a form, opening a dialog or muting audio.",
  what:"A button triggers an action. It's the simplest interactive widget in ARIA and one of the most often mis-built, because it's tempting to make one from a <div> or <span> that only looks like a button. A small convention worth knowing: a button that opens a dialog often ends its label with an ellipsis, like “Save as…”.",
  parts:[["Command button","role=\"button\" (or a native <button>) with no state. One-shot actions: Print, Save, Delete, Submit."],["Toggle button","Adds aria-pressed=\"true\" or \"false\". Two-state on/off, like Mute or Bold."],["Menu button","Adds aria-haspopup=\"menu\" (or \"true\"). Opens a menu; it has its own Menu Button pattern."]],
  callout:{title:"Toggle buttons keep their label", text:"A Mute button stays labelled “Mute” whether sound is on or off; aria-pressed carries the state, so screen readers say “Mute, toggle button, pressed”. If the design changes the text instead (Mute ↔ Unmute), don't use aria-pressed: the changing label already communicates the state."},
  demos:[
    {kind:"button-command", title:"Command button built from a div", note:"Everything the script does here, a native <button> does for free: the role, focusability, Enter and Space, and the focus style."},
    {kind:"button-toggle", title:"Toggle button with aria-pressed", note:"The label “Mute” never changes. Only aria-pressed and the visual style do."}
  ],
  sections:[
    {id:"button-vs-link", title:"Button or link?", html:"<p>Buttons perform actions on the current page; links navigate somewhere (another page, a URL, a place on the same page). Screen reader users are told “link” or “button” and expect the matching behaviour, so mixing them up is a common defect. A link with <code>href=\"#\"</code> and a click handler that submits a form is announced as a link but acts like a button.</p><p><b>Best fix:</b> match the markup and visual design to the function. Adding <code>role=\"button\"</code> to a link-styled element is acceptable when redesigning isn't possible, but a real button is the better long-term fix.</p>"},
    {id:"focus-after", title:"Where focus goes after activation", table:{caption:"Focus after button activation", head:["What the button does","Where focus should go"], rows:[
      ["Opens a dialog","Into the dialog (see the Dialog pattern)."],
      ["Closes a dialog (such as Cancel)","Back to the button that opened it, unless the action logically leads elsewhere (for example, the thing that opened it was just deleted)."],
      ["Doesn't dismiss the context (Apply, Recalculate)","Stays on the button."],
      ["Changes context (Next step in a wizard)","To the natural starting point of the new context."],
      ["Triggered by a keyboard shortcut","Usually stays where it was."]]}},
    {id:"idl", title:"The IDL (attribute reflection) syntax", html:"<p>APG also publishes a version of the button examples using ARIA attribute reflection (ARIA 1.2): <code>el.role = \"button\"</code> instead of <code>el.setAttribute(\"role\", \"button\")</code>, and <code>el.ariaPressed = \"true\"</code> instead of <code>el.setAttribute(\"aria-pressed\", \"true\")</code>. It's purely a developer convenience with an identical result in the accessibility tree. As an auditor, inspect the rendered DOM and accessibility tree, where both look the same. One more detail from that example: an icon inside a button should have <code>aria-hidden=\"true\"</code> so it doesn't get pulled into the accessible name.</p>"}
  ],
  keyboard:[["Enter","Activates the button."],["Space","Activates the button."]],
  kbNote:"That's the whole keyboard contract. Native buttons fire on Enter keydown and Space keyup; custom ones need both handled, and must prevent Space from scrolling the page.",
  roles:[
    ["Button","role=\"button\"","Only for non-native elements. <button> has it built in."],
    ["Button","Accessible name","From its text content by default; use aria-label or aria-labelledby for icon-only buttons."],
    ["Button (optional)","aria-describedby","Extra description of what the button does, in addition to its name."],
    ["Button (unavailable)","aria-disabled=\"true\"","Unlike the disabled attribute, it stays focusable, so screen reader users can discover it and why it's unavailable. Needs a matching visual style."],
    ["Toggle button","aria-pressed=\"true\" / \"false\"","Makes it a toggle and exposes the state."],
    ["Non-native element","tabindex=\"0\"","Makes a div or span focusable. Not needed on <button>."]
  ],
  code:[{label:"Command button from a div (and why not to)", code:String.raw`<div role="button" tabindex="0" id="print-btn">Print page</div>

const btn = document.getElementById('print-btn');
btn.addEventListener('click', doPrint);
btn.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();          // stop Space scrolling the page
    doPrint();
  }
});

/* all of the above, for free: */
<button type="button" onclick="doPrint()">Print page</button>`},
  {label:"Toggle button", code:String.raw`<button type="button" aria-pressed="false" id="mute">
  <svg aria-hidden="true" focusable="false">...</svg> Mute
</button>

mute.addEventListener('click', () => {
  const on = mute.getAttribute('aria-pressed') === 'true';
  mute.setAttribute('aria-pressed', String(!on));   // label stays "Mute"
});`}],

    ["Click handler only","role=\"button\" and tabindex=\"0\" are there, but Enter and Space do nothing."],
    ["Toggle label changes and aria-pressed changes","Redundant and can sound contradictory (“Unmute, pressed”). Pick one mechanism."],
    ["aria-disabled with no visual cue","Sighted users can't tell it's unavailable."],
    ["Icon-only button with no name","Announced as just “button”."],
    ["Link used as a button (or the reverse)","Users expect the announced role's behaviour."]
  ],
  good:"Use a native <button>. It's focusable, keyboard-operable and has the right role by default; add aria-pressed only for real toggles with a constant label.",
  wcag:[["4.1.2","Name, the button role, and pressed state for toggles."],["2.1.1","Enter and Space work, not just click."],["2.4.7","Custom buttons show visible focus."],["2.5.8","Icon-only buttons have a big enough target."],["2.5.3","A visible label is included in the accessible name."]],
  quiz:[
    {q:"A toggle's visible text changes from “Mute” to “Unmute”. Should it also use aria-pressed?", o:["Yes, always","No; the changing label already conveys the state"], a:1, e:"Use one mechanism: a constant label with aria-pressed, or a changing label without it."},
    {q:"Why prefer aria-disabled=\"true\" to the disabled attribute in some designs?", o:["It removes the button from the tab order","It keeps the button focusable so users can discover it and why it's unavailable"], a:1, e:"Disabled buttons are skipped by Tab; aria-disabled ones can still be reached."}
  ],

/* ============================== carousel */
carousel:{
  name:"Carousel", apg:APG+"carousel/", example:APG+"carousel/examples/carousel-1-prev-next/",
  kw:"carousel slider slideshow rotation auto-rotate pause stop aria-roledescription slide live region",
  summary:"A set of slides shown one at a time, rotated automatically or with controls. Also called a slide show or image rotator.",
  what:"A carousel presents content items (slides) one at a time. Carousels cause a lot of real-world harm, not because the ARIA is unusual, but because auto-rotation is disorienting. A screen reader user reading slide 1 presses “next element” and suddenly hears something from slide 2, with no sign the context changed. Low-vision users and people with cognitive or attention disabilities lose content before they finish reading it.",
  parts:[["Slide","One content container in the rotating set."],["Rotation control","A button that starts and stops automatic rotation."],["Next / previous controls","Buttons that step one slide forward or back."],["Slide picker controls","Dots or tabs that jump straight to a slide."]],
  demos:[{kind:"carousel", title:"Prev/next carousel with rotation control", note:"Rotation stops when focus enters the carousel and stays stopped until you press Start. Hovering pauses it until the pointer leaves. If your system asks for reduced motion, it starts stopped. While rotating, the slides' live region is off; when stopped, it's polite, so manual changes are announced."}],
  sections:[
    {id:"rotation", title:"The rotation control", html:"<p>If a carousel rotates automatically, APG requires:</p><ul><li>A visible start/stop button that is the <b>first</b> focusable element in the carousel, before the slides.</li><li>Rotation stops when keyboard focus enters the carousel, and doesn't restart until the user asks.</li><li>Rotation stops while the pointer hovers over the carousel.</li></ul><p>Also strongly recommended: start stopped if the user has <code>prefers-reduced-motion</code> set.</p><p>The rotation control's <b>label changes</b> with its state (“Stop automatic slide show” ↔ “Start automatic slide show”), so it does <b>not</b> use <code>aria-pressed</code>.</p>"},
    {id:"live", title:"The live region trick", table:{caption:"aria-live value by carousel state", head:["Carousel state","aria-live on the slides wrapper","Why"], rows:[["Rotating automatically","off","Otherwise every automatic change interrupts the screen reader."],["Stopped (user steps manually)","polite","Changes the user asked for are announced as feedback."]]}, after:"<p>Rule of thumb: announce only changes the user caused on purpose.</p>"},
    {id:"styles", title:"Basic, tabbed and grouped styles", table:{caption:"Carousel picker styles", head:["Style","Slide picker","Keyboard cost"], rows:[["Basic","None: rotation control plus previous/next","Lowest: 1–3 tab stops"],["Tabbed","A tablist following the Tabs pattern (roving tabindex, arrow keys)","Low: the whole picker is one tab stop"],["Grouped","Individual buttons in a role=\"group\"","Highest: one tab stop per slide"]]}, after:"<p>In the grouped style, the button for the current slide uses <code>aria-disabled=\"true\"</code> rather than <code>disabled</code>, so it stays discoverable. In the tabbed style, arrow keys activate slides immediately (automatic activation), because the content is already loaded.</p>"}
  ],
  keyboard:[["Tab / Shift + Tab","Moves through the carousel's controls and slide content in normal page order."],["Enter / Space on the rotation control","Starts or stops automatic rotation."],["Enter / Space on next / previous","Shows the next or previous slide. Focus stays on the button, so it can be pressed repeatedly."],["Arrow keys, Home, End on a tabbed picker","Follow the Tabs pattern."]],
  kbNote:"The rotation control must come first inside the carousel, so users meet it before they start reading a slide.",
  roles:[
    ["Carousel container","role=\"region\" or role=\"group\"","Groups the widget. Use region only if it deserves to be a landmark; otherwise group."],
    ["Carousel container","aria-roledescription=\"carousel\"","Announced as “carousel” instead of “region” or “group”. Localise it to the page language."],
    ["Carousel container","aria-label or aria-labelledby","Describes the content. Don't include the word “carousel”; the role description already says it."],
    ["Rotation control","<button>, label changes with state","No aria-pressed (see above)."],
    ["Next / previous","<button> with aria-label and aria-controls","aria-controls points at the slides container."],
    ["Each slide","role=\"group\", aria-roledescription=\"slide\", aria-label=\"3 of 6\"","The label gives position, since groups don't support aria-setsize/aria-posinset."],
    ["Slides wrapper","aria-live=\"off\" or \"polite\", aria-atomic=\"false\"","Switches with rotation state."]
  ],
  code:[{label:"Structure", code:String.raw`<section aria-roledescription="carousel" aria-label="Accessibility principles">
  <button type="button" class="rotation">Stop automatic slide show</button>
  <button type="button" aria-controls="slides" aria-label="Previous slide">‹</button>
  <button type="button" aria-controls="slides" aria-label="Next slide">›</button>

  <div id="slides" aria-live="off" aria-atomic="false">
    <div role="group" aria-roledescription="slide" aria-label="1 of 3">...</div>
    <div role="group" aria-roledescription="slide" aria-label="2 of 3" hidden>...</div>
    <div role="group" aria-roledescription="slide" aria-label="3 of 3" hidden>...</div>
  </div>
</section>`},
  {label:"Stop on focus and hover, respect reduced motion", code:String.raw`const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rotating = !reduced, stoppedByUser = reduced;

carousel.addEventListener('focusin', () => { stopped(true); });      // stays stopped
carousel.addEventListener('mouseenter', () => pause());
carousel.addEventListener('mouseleave', () => { if (!stoppedByUser) play(); });

function setRotating(on) {
  rotating = on;
  slides.setAttribute('aria-live', on ? 'off' : 'polite');
  rotationBtn.textContent = on ? 'Stop automatic slide show' : 'Start automatic slide show';
}`}],
  mistakes:[
    ["No way to stop auto-rotation","A visible, keyboard-reachable control is essential; this also fails 2.2.2 when rotation lasts more than 5 seconds."],
    ["Rotation continues while focus is inside","Content is pulled away mid-read."],
    ["Live region polite or assertive while rotating","Constant, unrequested announcements."],
    ["Rotation control uses aria-pressed and changes its label","Redundant; APG uses the changing label."],
    ["Rotation control after the slides in tab order","It must come first."],
    ["Ignoring prefers-reduced-motion (best practice)","Users who asked for less motion should get a stopped carousel."],
    ["Text over changing images fails contrast","Check every slide, not just the first."]
  ],
  good:"A labelled carousel group with a first-in-order rotation control whose label reflects its state, rotation that stops on focus and hover, slides labelled “N of M”, and a live region that is off while rotating and polite otherwise.",
  wcag:[["2.2.2","The key criterion: auto-rotating content needs a way to pause, stop or hide it."],["2.1.1","Rotate, pause, step and pick all work by keyboard."],["4.1.2","Controls expose names and states."],["1.4.3","Text over rotating images keeps enough contrast on every slide."],["2.4.3","The rotation control comes before the slides in the focus order."]],
  quiz:[
    {q:"What should aria-live be on the slides while the carousel rotates automatically?", o:["polite","assertive","off"], a:2, e:"Automatic changes stay silent; user-initiated changes are announced politely."},
    {q:"Where must the rotation control be in the tab order?", o:["After the slides","First, before the slides","Anywhere"], a:1, e:"Users should meet it before they start reading a slide."}
  ],
  recap:"A carousel is a group or region with aria-roledescription=\"carousel\", containing slides with aria-roledescription=\"slide\". If it auto-rotates, it needs a first-in-order rotation control whose label reflects its state, rotation must stop on focus and hover, and the slides' live region is off while rotating and polite otherwise. A tabbed picker (one tab stop) is kinder to keyboard users than grouped buttons (one stop per slide)."
},

/* ============================== checkbox */
checkbox:{
  name:"Checkbox", apg:APG+"checkbox/", example:APG+"checkbox/examples/checkbox/",
  kw:"checkbox tri-state mixed select all aria-checked group aria-controls",
  summary:"A control with two states (checked, not checked) or three (checked, not checked, partially checked).",
  what:"A checkbox turns one option on or off. The tri-state (mixed) version is usually a “select all” control that summarises a group of ordinary checkboxes. In both cases the name comes from the checkbox's visible text, or from aria-labelledby or aria-label if the label is elsewhere.",
  parts:[["Two-state","Checked or not checked. “Add sprouts to my sandwich.”"],["Tri-state","Checked, not checked, or mixed. A “select all” that reflects the group below it."]],
  demos:[
    {kind:"checkbox-two", title:"Two-state checkboxes in a group", note:"Tab to a checkbox and press Space. The group label “Sandwich condiments” is announced when you enter the group."},
    {kind:"checkbox-mixed", title:"Tri-state “select all”", note:"Change individual condiments and watch “All condiments” become mixed; toggle “All condiments” and the whole group follows. aria-controls on it lists the ids of the four checkboxes it governs."}
  ],
  sections:[
    {id:"mixed", title:"How the tri-state checkbox behaves", table:{caption:"Select-all state by group state", head:["Group state","“Select all” shows"], rows:[["Every option checked","Checked (aria-checked=\"true\")"],["No options checked","Not checked (aria-checked=\"false\")"],["Some checked","Partially checked (aria-checked=\"mixed\")"]]}, after:"<p>Activating it works the other way too: checking it checks everything, unchecking it clears everything. Some implementations add a third step that restores the last partial combination, cycling mixed → checked → unchecked → mixed.</p>"},
    {id:"high-contrast", title:"High contrast mode detail", html:"<p>The APG checkbox examples are careful about forced-colours (high contrast) modes. Instead of making a focus border transparent, they change the border width (for example 0 to 2px) and adjust padding so the size doesn't change, which stays visible under any colour scheme. Custom SVG check marks use <code>currentColor</code> so they follow the system colours. This is a CSS concern rather than an ARIA one, but worth checking in Windows contrast themes.</p>"}
  ],
  keyboard:[["Tab","Moves to the next checkbox or other focusable element."],["Space","Two-state: toggles checked and not checked. Tri-state: cycles as described above."]],
  roles:[
    ["Checkbox","role=\"checkbox\"","Only for non-native elements. <input type=\"checkbox\"> has it built in."],
    ["Checkbox","Accessible name","Visible text inside it, or aria-labelledby / aria-label."],
    ["Checkbox","aria-checked=\"true\" / \"false\" / \"mixed\"","Current state; mixed only for tri-state."],
    ["Non-native checkbox","tabindex=\"0\"","Makes a div or span focusable."],
    ["Group of checkboxes","role=\"group\" with aria-labelledby (or <fieldset> and <legend>)","Gives the set a shared label."],
    ["Select-all checkbox","aria-controls=\"id1 id2 id3…\"","Lists the checkboxes it governs."],
    ["Checkbox (optional)","aria-describedby","Extra explanatory text."]
  ],
  code:[{label:"Native first", code:String.raw`<fieldset>
  <legend>Sandwich condiments</legend>
  <label><input type="checkbox" name="c" value="lettuce"> Lettuce</label>
  <label><input type="checkbox" name="c" value="tomato"> Tomato</label>
</fieldset>

allBox.indeterminate = true;   // native mixed state, set by script`},
  {label:"Custom tri-state", code:String.raw`<div role="group" aria-labelledby="cond-h">
  <h3 id="cond-h">Sandwich condiments</h3>
  <div role="checkbox" tabindex="0" aria-checked="mixed"
       aria-controls="c-lettuce c-tomato c-mustard c-sprouts">All condiments</div>
  <div role="checkbox" tabindex="0" aria-checked="true" id="c-lettuce">Lettuce</div>
  ...
</div>`}],
  mistakes:[
    ["Custom checkbox with no keyboard support","Click handler only; Space does nothing."],
    ["aria-checked out of sync with the visual","Screen reader users are told the opposite of what they see."],
    ["Related checkboxes without a group label","Users hear unrelated checkboxes with no shared context."],
    ["“Select all” never reports mixed","It misrepresents a partial selection."],
    ["No aria-controls on the summary checkbox","No programmatic link to the options it affects."],
    ["Checked state shown only by colour","Needs a check mark or shape change too."]
  ],
  good:"Prefer <input type=\"checkbox\"> inside a <fieldset> with a <legend>; use the indeterminate property for a select-all. Build custom ones only when native styling really can't work.",
  wcag:[["4.1.2","Name, checkbox role, and checked, unchecked or mixed state."],["2.1.1","Space toggles, not just click."],["1.3.1","The group and the select-all relationship are in the code."],["2.4.7","Custom checkboxes show visible focus."],["1.4.1","Checked state isn't conveyed by colour alone."],["1.4.11","The box outline and check mark have 3:1 contrast."]],
  quiz:[
    {q:"Which aria-checked value is only valid on a tri-state checkbox?", o:["true","mixed","false"], a:1, e:"“mixed” means partially checked."},
    {q:"What does aria-controls on a select-all checkbox contain?", o:["The group's label","The ids of the checkboxes it governs"], a:1, e:"It links the summary control to the options it changes."}
  ],
  recap:"A checkbox is role=\"checkbox\" with aria-checked true, false, or mixed for tri-state. Space toggles it. Prefer the native input, group related checkboxes under a shared label, and make a select-all reference its options with aria-controls and genuinely report mixed."
