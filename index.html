rs"], "int": ["errors", "forms", "messaging"], "vis": ["content", "messaging", "progress-steps", "visual-cues"]}, "how": ["Expose status messages with a role or property so they're announced without moving focus.", "<div role=\"status\">Added to cart</div>"], "suf": [{"sit": "Messages about the success or result of an action, or the state of the app", "g": [{"h": null, "i": [{"t": "{ARIA22} together with any of:", "s": [{"t": "{G199}"}]}]}]}, {"sit": "Messages giving a suggestion or warning of an error", "g": [{"h": null, "i": [{"t": "{ARIA19} together with any of:", "s": [{"t": "{G83}"}, {"t": "{G84}"}, {"t": "{G85}"}, {"t": "{G177}"}, {"t": "{G194}"}]}]}, {"h": "Note: not every error or warning needs a status message. role=\"alert\" is only needed when the page doesn't change context (for example, focus doesn't move).", "i": []}]}, {"sit": "Messages about the progress of a process", "g": [{"h": null, "i": [{"t": "{ARIA23}"}, {"t": "Planned technique: role=\"progressbar\" for progress."}, {"t": "{ARIA22} and {G193}"}]}]}], "adv": [{"g": [{"h": null, "i": [{"t": "Planned technique: live regions in chat apps."}, {"t": "Planned technique: live regions for content that appears on hover or focus."}, {"t": "Planned technique: role=\"marquee\" for scrolling text."}, {"t": "Planned technique: role=\"timer\" for countdowns."}, {"t": "Where it makes sense, move focus to the new content with: {ARIA18}"}, {"t": "Support personalisation with: {SCR14}"}]}]}], "fail": [{"g": [{"h": null, "i": [{"t": "{F103}"}, {"t": "Planned failure: using role=\"alert\" or assertive announcements for things that aren't urgent."}]}]}]}];
const MEET_REQ = {"1.1.1": {"r": "Anything that isn't text (images, icons, charts, controls, audio, video) needs a text alternative that does the same job, with these special cases:", "c": [["Controls and inputs", "They need a name that says what they do. (4.1.2 adds more rules for controls.)"], ["Audio and video", "The text alternative must at least say what the media is. (Guideline 1.2 covers the rest.)"], ["Tests and exercises", "If the test wouldn't work as text (a listening test, say), the alternative at least identifies what it is."], ["Sensory experiences", "For things meant to be experienced (music, art), the alternative at least identifies and describes it."], ["CAPTCHA", "Say what it's for in text, and offer another version that uses a different sense (for example audio as well as visual)."], ["Decoration, formatting, invisible", "Hide it from assistive technology."]], "n": []}, "1.2.1": {"r": "For recorded audio-only and recorded video-only content:", "c": [["Audio-only", "Provide a text alternative (usually a transcript) with the same information."], ["Video-only", "Provide a text alternative or an audio track with the same information."], ["Exception", "Not needed when the media is itself an alternative to text on the page and is clearly labelled as such."]], "n": []}, "1.2.2": {"r": "Recorded video with sound has captions for all its audio.", "c": [["Exception", "Not needed when the media is an alternative to text on the page and is clearly labelled as such."]], "n": []}, "1.2.3": {"r": "Recorded video with sound has either audio description of its visual content or a full text alternative.", "c": [["Exception", "Not needed when the media is an alternative to text on the page and is clearly labelled as such."]], "n": []}, "1.2.4": {"r": "Live video with sound has captions for all its audio.", "c": [], "n": []}, "1.2.5": {"r": "Recorded video with sound has audio description of its visual content. (Unlike 1.2.3, a text alternative alone isn't enough.)", "c": [], "n": []}, "1.2.6": {"r": "Recorded video with sound has sign language interpretation of all its audio.", "c": [], "n": []}, "1.2.7": {"r": "If the pauses in the soundtrack are too short for audio description to explain the video, extended audio description is provided (the video pauses so the description can play).", "c": [], "n": []}, "1.2.8": {"r": "All recorded video, with or without sound, has a full text alternative.", "c": [], "n": []}, "1.2.9": {"r": "Live audio-only content has a text alternative with the same information, such as real-time text.", "c": [], "n": []}, "1.3.1": {"r": "Any information, structure or relationship shown by the visual presentation is also available in code, or spelled out in text.", "c": [], "n": []}, "1.3.2": {"r": "When the order of content affects its meaning, the correct reading order is available in code.", "c": [], "n": []}, "1.3.3": {"r": "Instructions don't rely only on sensory characteristics such as shape, colour, size, visual position, orientation or sound.", "c": [], "n": ["Colour specifically is covered by Guideline 1.4 (see 1.4.1)."]}, "1.3.4": {"r": "Content isn't locked to one display orientation (portrait or landscape), unless a particular orientation is essential.", "c": [], "n": ["Examples where an orientation may be essential: a bank cheque, a piano app, slides for a projector or TV, and virtual reality."]}, "1.3.5": {"r": "The purpose of each field that collects information about the user can be identified in code, when both of these apply:", "c": [["Listed purpose", "The field matches one of the purposes in WCAG's Input Purposes list (name, email, address, phone and so on)."], ["Supported technology", "The technology can express that purpose (in HTML, the autocomplete attribute)."]], "n": []}, "1.3.6": {"r": "In markup, the purpose of controls, icons and page regions can be identified in code.", "c": [], "n": []}, "1.4.1": {"r": "Colour isn't the only visual way of showing information, indicating an action, prompting a response or distinguishing an element.", "c": [], "n": ["This one is about colour perception. Other senses and getting colour meaning into code are covered in Guideline 1.3."]}, "1.4.2": {"r": "If audio plays automatically for more than 3 seconds, there's a way to pause or stop it, or to change its volume separately from the system volume.", "c": [], "n": ["This applies to everything on the page, even content not used to meet other criteria, because sound can stop people using the whole page (the non-interference requirement)."]}, "1.4.3": {"r": "Text and images of text have a contrast ratio of at least 4.5:1, except:", "c": [["Large text", "Large text (at least 18pt / 24px, or 14pt / about 18.66px bold) needs 3:1."], ["Incidental", "No requirement for text in inactive (disabled) controls, pure decoration, text nobody can see, or text in a picture that mainly shows something else."], ["Logotypes", "No requirement for text in a logo or brand name."]], "n": []}, "1.4.4": {"r": "Text can be resized up to 200% without assistive technology and without losing content or functionality.", "c": [["Exception", "Captions and images of text are excluded."]], "n": []}, "1.4.5": {"r": "If the technology can produce the look you want with real text, use real text, not images of text, except:", "c": [["Customisable", "The image of text can be adjusted to the user's needs."], ["Essential", "A particular presentation is essential to the information."]], "n": ["Logos and brand names count as essential."]}, "1.4.6": {"r": "Text and images of text have a contrast ratio of at least 7:1, except:", "c": [["Large text", "Large text needs 4.5:1."], ["Incidental", "No requirement for disabled controls, decoration, invisible text, or text in a picture that mainly shows something else."], ["Logotypes", "No requirement for logos and brand names."]], "n": []}, "1.4.7": {"r": "Recorded audio that is mainly foreground speech meets at least one of these (not audio CAPTCHAs, audio logos, or singing and rapping meant as music):", "c": [["No background", "There are no background sounds."], ["Turn off", "The background sounds can be turned off."], ["20 dB", "Background sounds are at least 20 dB quieter than the speech, apart from occasional sounds lasting one or two seconds."]], "n": ["20 dB quieter is roughly four times quieter."]}, "1.4.8": {"r": "For blocks of text, users have a way to get all of these:", "c": [["Colours", "They can choose the text and background colours."], ["Line length", "Lines are no wider than 80 characters (40 for Chinese, Japanese or Korean)."], ["Alignment", "Text isn't justified (aligned to both margins)."], ["Spacing", "Line spacing is at least 1.5 within paragraphs, and paragraph spacing is at least 1.5 times the line spacing."], ["Resize", "Text can be resized to 200% without having to scroll sideways to read a line in a full-screen window."]], "n": ["Content doesn't have to use these values; users just need a way to get them. That way can come from the browser, so the page doesn't have to provide it.", "Some writing systems use different presentation features. If a feature here isn't used in that writing system, content in it can conform without it."]}, "1.4.9": {"r": "Images of text are used only for pure decoration or where a particular presentation is essential.", "c": [], "n": ["Logos and brand names count as essential."]}, "1.4.10": {"r": "Content can be used without losing information or functionality, and without scrolling in two directions, at:", "c": [["Vertical pages", "A width of 320 CSS pixels."], ["Horizontal pages", "A height of 256 CSS pixels (for content designed to scroll sideways)."], ["Exception", "Parts that need a two-dimensional layout to be usable or understood."]], "n": ["320 CSS pixels equals a 1280px-wide window at 400% zoom; 256 CSS pixels equals a 1024px-high window at 400% zoom.", "Examples of two-dimensional content: maps and diagrams needed for understanding, video, games, presentations, data tables (the table, not individual cells), and interfaces where toolbars must stay visible while working. Scrolling in two directions is fine for those parts."]}, "1.4.11": {"r": "These have a contrast ratio of at least 3:1 against the colours next to them:", "c": [["Controls", "The visual parts needed to identify controls and their states. Excludes disabled controls and controls whose look comes from the browser and hasn't been changed by the author."], ["Graphics", "Parts of graphics needed to understand the content, unless a particular presentation is essential."]], "n": []}, "1.4.12": {"r": "Where the technology supports these text styles, nothing is lost or broken when users set all of these (and change nothing else):", "c": [["Line height", "At least 1.5 times the font size."], ["Paragraph spacing", "At least 2 times the font size after paragraphs."], ["Letter spacing", "At least 0.12 times the font size."], ["Word spacing", "At least 0.16 times the font size."], ["Exception", "Languages and scripts that don't use one of these properties only need the ones they use."]], "n": ["Content doesn't have to use these values; it just has to survive users overriding spacing.", "Some writing systems use other spacing conventions, such as indenting the first line; follow local guidance for those."]}, "1.4.13": {"r": "When hovering over or focusing something makes extra content appear (and moving away hides it), all of these are true:", "c": [["Dismissible", "Users can dismiss it without moving the pointer or focus (for example with Escape), unless it shows an input error or doesn't cover or replace other content."], ["Hoverable", "If hover shows it, users can move the pointer onto it without it disappearing."], ["Persistent", "It stays visible until the hover or focus is removed, the user dismisses it, or its information is no longer valid."], ["Exception", "Content whose appearance is controlled by the browser and not changed by the author."]], "n": ["Browser tooltips from the HTML title attribute are an example of the exception.", "Custom tooltips, submenus and other non-modal popups that appear on hover and focus are covered.", "It covers content that appears in addition to the trigger. Things that simply become visible when focused, like a skip link, aren't covered."]}, "2.1.1": {"r": "Everything can be operated with a keyboard, without needing particular timing for keystrokes, except where the function itself depends on the path of the user's movement, not just the start and end points.", "c": [], "n": ["The exception is about the function, not the input method. Handwriting is path-based, but its function (entering text) isn't, so text entry must still work by keyboard.", "Offering mouse or other input as well is fine and encouraged."]}, "2.1.2": {"r": "If keyboard focus can move into a component, it can move out again using only the keyboard. If that needs more than arrow keys, Tab or other standard exits, users are told how.", "c": [], "n": ["This applies to everything on the page (non-interference), because a trap anywhere blocks the whole page."]}, "2.1.3": {"r": "Everything can be operated with a keyboard, without needing particular timing for keystrokes, with no exceptions.", "c": [], "n": []}, "2.1.4": {"r": "If a keyboard shortcut uses only a letter, number, punctuation or symbol key, at least one of these is true:", "c": [["Turn off", "There's a way to turn the shortcut off."], ["Remap", "There's a way to remap it to include a non-printing key such as Ctrl or Alt."], ["Only on focus", "The shortcut only works when its component has focus."]], "n": []}, "2.2.1": {"r": "For each time limit set by the content, at least one of these is true:", "c": [["Turn off", "Users can turn the limit off before they reach it."], ["Adjust", "Users can adjust it before they reach it, over a range at least ten times the default."], ["Extend", "Users are warned before time runs out, get at least 20 seconds to extend with a simple action (like pressing a key), and can extend at least ten times."], ["Real-time exception", "The limit is a required part of a real-time event (like an auction) and no alternative is possible."], ["Essential exception", "The limit is essential and extending it would invalidate the activity."], ["20-hour exception", "The limit is longer than 20 hours."]], "n": ["This stops time limits from causing unexpected changes. Consider it together with 3.2.1, which limits changes caused by user actions."]}, "2.2.2": {"r": "For moving, blinking, scrolling or auto-updating information, all of these are true:", "c": [["Moving, blinking, scrolling", "If it starts automatically, lasts more than 5 seconds and appears alongside other content, users can pause, stop or hide it, unless the movement is essential to the activity."], ["Auto-updating", "If it starts automatically and appears alongside other content, users can pause, stop or hide it, or control how often it updates, unless updating is essential to the activity."]], "n": ["Flashing is covered separately in Guideline 2.3.", "This applies to everything on the page (non-interference), because movement can stop people using the whole page.", "When users resume a paused live feed, it doesn't have to show what was missed while paused.", "A loading animation can count as essential if nobody can interact during that phase and showing no progress would make the page look frozen or broken."]}, "2.2.3": {"r": "Timing isn't an essential part of the activity, except for non-interactive media (like a video) and real-time events.", "c": [], "n": []}, "2.2.4": {"r": "Users can postpone or turn off interruptions, except those about an emergency.", "c": [], "n": []}, "2.2.5": {"r": "When a signed-in session expires, users can sign in again and carry on without losing data.", "c": [], "n": []}, "2.2.6": {"r": "Users are warned how long they can be inactive before they would lose data, unless the data is kept for more than 20 hours of inactivity.", "c": [], "n": ["Privacy laws may require consent before storing data for unidentified users, and consent may not be valid from minors in many places. Check with privacy and legal advisers before relying on storing data."]}, "2.3.1": {"r": "Nothing flashes more than three times in any one-second period, or the flashing is below the general flash and red flash thresholds.", "c": [], "n": ["This applies to everything on the page (non-interference), because flashing can harm people whatever else they're doing."]}, "2.3.2": {"r": "Nothing flashes more than three times in any one-second period, with no threshold allowance.", "c": [], "n": []}, "2.3.3": {"r": "Motion animation triggered by interaction can be turned off, unless it's essential to the function or information.", "c": [], "n": []}, "2.4.1": {"r": "There's a way to skip past blocks of content that repeat on multiple pages.", "c": [], "n": []}, "2.4.2": {"r": "Pages have titles that describe their topic or purpose.", "c": [], "n": []}, "2.4.3": {"r": "If a page can be navigated in sequence and the order matters for meaning or operation, focus moves through components in an order that keeps meaning and operability.", "c": [], "n": []}, "2.4.4": {"r": "Each link's purpose can be worked out from its text alone, or its text together with its context in code (sentence, paragraph, list item, table cell or heading), except where the purpose would be unclear to everyone.", "c": [], "n": []}, "2.4.5": {"r": "There's more than one way to find a page within a set of pages, except where the page is a step in, or the result of, a process.", "c": [], "n": []}, "2.4.6": {"r": "Headings and labels describe their topic or purpose.", "c": [], "n": []}, "2.4.7": {"r": "Any keyboard-operable interface has a mode where the keyboard focus indicator is visible.", "c": [], "n": []}, "2.4.8": {"r": "Information about where the user is within a set of pages is available.", "c": [], "n": []}, "2.4.9": {"r": "There's a way for each link's purpose to be identified from its text alone, except where the purpose would be unclear to everyone.", "c": [], "n": []}, "2.4.10": {"r": "Section headings are used to organise the content.", "c": [], "n": ["“Heading” is meant broadly and includes titles and other ways of heading content.", "This covers sections of writing, not interface components (those are under 4.1.2)."]}, "2.4.11": {"r": "When a component receives keyboard focus, it isn't entirely hidden by content the author created.", "c": [], "n": ["If users can move content around (in a configurable interface), only its starting positions are tested.", "Content the user opened may cover the focused component. If users can reveal it without moving focus (for example by closing that content), it doesn't count as hidden."]}, "2.4.12": {"r": "When a component receives keyboard focus, no part of it is hidden by content the author created.", "c": [], "n": []}, "2.4.13": {"r": "When the keyboard focus indicator is visible, an area of it meets both of these:", "c": [["Size", "At least as large as a 2 CSS pixel thick outline around the unfocused component (or sub-component)."], ["Contrast", "At least 3:1 contrast between the same pixels in the focused and unfocused states."], ["Exception", "The indicator is set by the browser and the author can't change it."], ["Exception", "The author hasn't changed the indicator or its background colour."]], "n": ["What counts as the component (for measuring the outline) depends on how it looks: its visible content, border and own background, but not shadows or glows outside it.", "Sub-components include items in an open dropdown menu and focusable cells in a grid.", "Contrast can be measured from the colours defined in the code; pixels altered by anti-aliasing or resolution enhancement can be ignored."]}, "2.5.1": {"r": "Anything operated with multi-finger or path-based gestures can also be operated with a single pointer without a path, unless the gesture is essential.", "c": [], "n": ["This applies to gestures the web content interprets, not gestures needed to operate the browser or assistive technology."]}, "2.5.2": {"r": "For anything operated with a single pointer, at least one of these is true:", "c": [["No down-event", "The down-event (press) isn't used to run any part of the function."], ["Abort or undo", "The function completes on the up-event (release), and users can abort it before completing or undo it afterwards."], ["Up reversal", "The up-event reverses whatever the down-event did."], ["Essential", "Completing on the down-event is essential."]], "n": ["Functions that imitate pressing a keyboard or keypad key count as essential.", "This applies to pointer actions the web content interprets, not those needed to operate the browser or assistive technology."]}, "2.5.3": {"r": "For controls with a visible text label (or an image of text), the accessible name contains the visible text.", "c": [], "n": ["Best practice: put the visible text at the start of the name."]}, "2.5.4": {"r": "Anything operated by moving the device or by user motion can also be operated with normal controls, and responding to motion can be turned off to prevent accidental activation, except:", "c": [["Supported interface", "The motion operates the function through an accessibility-supported interface."], ["Essential", "The motion is essential and using controls instead would invalidate the activity."]], "n": []}, "2.5.5": {"r": "Pointer targets are at least 44 by 44 CSS pixels, except:", "c": [["Equivalent", "The same function is available through another target on the same page that is at least 44 by 44."], ["Inline", "The target is in a sentence or block of text."], ["Browser control", "The size is set by the browser and not changed by the author."], ["Essential", "A particular presentation is essential to the information."]], "n": []}, "2.5.6": {"r": "Content doesn't restrict the input methods available on a platform, except where that's essential, needed for security, or needed to respect user settings.", "c": [], "n": []}, "2.5.7": {"r": "Anything operated by dragging can also be done with a single pointer without dragging, unless dragging is essential or the behaviour comes from the browser and isn't changed by the author.", "c": [], "n": ["This applies to pointer actions the web content interprets, not those needed to operate the browser or assistive technology."]}, "2.5.8": {"r": "Pointer targets are at least 24 by 24 CSS pixels, except:", "c": [["Spacing", "Smaller targets are spaced so that a 24px circle centred on each doesn't overlap another target or another small target's circle."], ["Equivalent", "The same function is available through another control on the same page that meets this."], ["Inline", "The target is in a sentence, or its size is limited by the line height of surrounding text."], ["Browser control", "The size is set by the browser and not changed by the author."], ["Essential", "A particular presentation is essential or legally required."]], "n": ["Targets where you pick a value by position within them (sliders, colour gradients, text areas where you place the cursor) count as one target.", "For inline targets, “line height” means the direction perpendicular to the text; for vertical text it's horizontal."]}, "3.1.1": {"r": "The default human language of each page can be identified in code.", "c": [], "n": []}, "3.1.2": {"r": "The language of each passage or phrase can be identified in code, except for proper names, technical terms, words of unclear language, and words that have become part of the surrounding language.", "c": [], "n": []}, "3.1.3": {"r": "There's a way to find the specific meaning of words used in an unusual or restricted way, including idioms and jargon.", "c": [], "n": []}, "3.1.4": {"r": "There's a way to find the expanded form or meaning of abbreviations.", "c": [], "n": []}, "3.1.5": {"r": "When text needs reading ability above lower secondary education (ignoring proper names and titles), a simpler version or supplementary content is available.", "c": [], "n": []}, "3.1.6": {"r": "There's a way to find the pronunciation of words whose meaning, in context, is unclear without knowing how they're said.", "c": [], "n": []}, "3.2.1": {"r": "When any component receives focus, that alone doesn't cause a change of context.", "c": [], "n": []}, "3.2.2": {"r": "Changing a setting of any component doesn't automatically cause a change of context, unless users were told about that behaviour before using the component.", "c": [], "n": []}, "3.2.3": {"r": "Navigation repeated on multiple pages appears in the same relative order each time, unless the user changes it.", "c": [], "n": []}, "3.2.4": {"r": "Components with the same function are identified consistently across a set of pages.", "c": [], "n": []}, "3.2.5": {"r": "Changes of context happen only when users request them, or there's a way to turn automatic changes off.", "c": [], "n": []}, "3.2.6": {"r": "If any of these help mechanisms appear on multiple pages, they're in the same order relative to other content, unless the user changes it:", "c": [["Human contact details", "For example a phone number, email address or opening hours."], ["Human contact mechanism", "For example a contact form, messaging or live chat with a person."], ["Self-help", "For example an FAQ, help pages or a support page."], ["Automated contact", "For example a chatbot."]], "n": ["The help can be on the page itself or reached through a direct link to another page.", "“Same order” means the order in the page's code. Visual position may change with the layout (for example at a different breakpoint, zoom level or orientation the user chooses)."]}, "3.3.1": {"r": "If an input error is detected automatically, the item in error is identified and the error is described in text.", "c": [], "n": []}, "3.3.2": {"r": "Labels or instructions are provided when content requires user input.", "c": [], "n": []}, "3.3.3": {"r":   function wireMenuButton(prefix, technique, onPick){
    const btn = document.getElementById(prefix + "-btn"), menu = document.getElementById(prefix + "-menu");
    const items = [...menu.querySelectorAll('[role="menuitem"]')];
    let idx = 0;
    const setActive = n => {

    menu.addEventListener("keydown", e => {
      if (e.key === "ArrowDown"){ e.preventDefault(); setActive(idx + 1); }
      else if (e.key === "ArrowUp"){ e.preventDefault(); setActive(idx - 1); }
      else if (e.key === "Home"){ e.preventDefault(); setActive(0); }
      else if (e.key === "End"){ e.preventDefault(); setActive(items.length - 1); }
      else if (e.key === "Escape"){ e.preventDefault(); close(true); }
      else if (e.key === "Tab"){ close(false); }
      else if (e.key === "Enter" || e.key === " "){ e.preventDefault(); onPick(items[idx]); close(true); }
      else if (/^[a-z0-9]$/i.test(e.key)){ const k = items.findIndex((it, n) => n > idx && it.textContent.trim().toLowerCase().startsWith(e.key.toLowerCase())); const w = k > -1 ? k : items.findIndex(it => it.textContent.trim().toLowerCase().startsWith(e.key.toLowerCase())); if (w > -1) setActive(w); }

    menu.addEventListener("focusout", e => { if (!menu.contains(e.relatedTarget) && e.relatedTarget !== btn) close(false); });
  }

            if (e.key === "ArrowDown"){ e.preventDefault(); its[(k + 1) % its.length].focus(); }

  function makeSlider(thumb, o){
    const rail = thumb.closest(".sl-rail"), fill = rail.querySelector(".sl-fill");
    const get = () => +thumb.getAttribute("aria-valuenow");
    const lo = () => +thumb.getAttribute("aria-valuemin"), hi = () => +thumb.getAttribute("aria-valuemax");
    const vert = thumb.getAttribute("aria-orientation") === "vertical";
    const range = o.range || [lo(), hi()];
    const place = () => { const pct = (get() - range[0]) / (range[1] - range[0]) * 100; if (vert){ thumb.style.bottom = pct + "%"; if (!o.noFill) fill.style.height = pct + "%"; } else { thumb.style.left = pct + "%"; if (!o.noFill) fill.style.width = pct + "%"; } };
    const set = v => { v = Math.max(lo(), Math.min(hi(), Math.round(v))); thumb.setAttribute("aria-valuenow", String(v)); if (o.text) thumb.setAttribute("aria-valuetext", o.text(v, "adjust")); place(); o.onChange && o.onChange(v); };
    thumb.addEventListener("keydown", e => {
      const k = e.key, step = 1, page = o.page || 10; let v = get();
      if (k === "ArrowRight" || k === "ArrowUp") v += step; else if (k === "ArrowLeft" || k === "ArrowDown") v -= step;
      else if (k === "PageUp") v += page; else if (k === "PageDown") v -= page;
      else if (k === "Home") v = lo(); else if (k === "End") v = hi(); else return;
      e.preventDefault(); set(v);
    });
    const fromPointer = e => { const r = rail.getBoundingClientRect(); const f = vert ? 1 - (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width; return range[0] + Math.max(0, Math.min(1, f)) * (range[1] - range[0]); };
    if (!o.noRail) rail.addEventListener("pointerdown", e => { if (e.target === thumb) return; set(fromPointer(e)); thumb.focus(); });
    thumb.addEventListener("pointerdown", e => { e.preventDefault(); thumb.focus(); thumb.setPointerCapture(e.pointerId); const mv = ev => set(fromPointer(ev)); const up = () => { thumb.removeEventListener("pointermove", mv); thumb.removeEventListener("pointerup", up); }; thumb.addEventListener("pointermove", mv); thumb.addEventListener("pointerup", up); });
    place();
    return { set, place, get };
  }

  /* ---------- How to meet ---------- */
  const MEET_ROLES = [["con","Content creation"],["dev","Developing"],["int","Interaction design"],["vis","Visual design"]];
  const MEET_TECHS = [["G","General"],["H","HTML"],["C","CSS"],["ARIA","ARIA"],["SCR","Client-side script"],["SVR","Server-side script"],["SM","SMIL"],["PDF","PDF"],["T","Plain text"]];
  const meetState = { roles:new Set(), levels:new Set(["A","AA","AAA"]), types:new Set(["suf","adv","fail"]), techs:new Set(MEET_TECHS.map(t => t[0])), topic:"", q:"" };
  const techPrefix = id => (/^[A-Z]+/.exec(id) || [""])[0];
  const techHref = id => "https://www.w3.org/WAI/WCAG22/Techniques/" + (MEET_DIR[id] || "general") + "/" + id;

  function meetItems(items){
    return `<ul class="mt-list">${items.map(it => {
      const ids = [...it.t.matchAll(/\{([A-Z]+\d+)\}/g)].map(m => m[1]);
      const pref = [...new Set(ids.map(techPrefix))].join(" ");
      const simple = ids.length === 1 && it.t.trim() === "{" + ids[0] + "}";
      const chip = id => `<a class="mt-id" href="${techHref(id)}" target="_blank" rel="noopener">${id}<span class="visually-hidden"> (opens W3C technique in a new tab)</span></a>`;
      const expl = id => { const t = MEET_TECH[id]; return t ? `<span class="mt-exp">${esc(t[0])}</span><span class="mt-ex"><span class="mt-ex-l">Example:</span> ${esc(t[1])}</span>` : ""; };
      let inner;
      if (simple) inner = `<div class="mt-item">${chip(ids[0])}<div>${expl(ids[0])}</div></div>`;
      else {
        const line = esc(it.t).replace(/\{([A-Z]+\d+)\}/g, (m, id) => chip(id));
        inner = `<div class="mt-line">${line}</div>${ids.length ? `<ul class="mt-sub-exp">${ids.map(id => `<li><b>${id}</b> ${expl(id)}</li>`).join("")}</ul>` : ""}`;
      }
      return `<li data-tech="${pref}">${inner}${it.s ? meetItems(it.s) : ""}</li>`;
    }).join("")}</ul>`;
  }
  function meetBlocks(blocks){
    return blocks.map(b => `<div class="mt-block">${b.sit ? `<p class="mt-sit"><span class="mt-sit-l">Situation</span> ${esc(b.sit)}</p>` : ""}${b.g.map(g => `${g.h ? `<p class="mt-gh">${esc(g.h)}</p>` : ""}${g.i.length ? meetItems(g.i) : ""}`).join("")}</div>`).join("");
  }

  function renderMeet(){
    const scTitle = id => { const c = ALL.find(x => x.id === id); return c ? c.title : (id === "4.1.1" ? "Parsing" : id); };
    const topics = [...new Set(MEET_SC.flatMap(s => Object.values(s.tags).flat()))].sort();
    const chip = (group, val, label, on) => `<button type="button" class="chip" data-mf="${group}" data-v="${val}" aria-pressed="${on}">${I.tick}${esc(label)}</button>`;
    let body = "";
    PRINCIPLES.forEach(p => {
      body += `<section class="mt-principle" aria-labelledby="mtp-${p.num}"><h2 id="mtp-${p.num}" class="a-h">${p.num}. ${esc(p.name)}</h2>`;
      p.guidelines.forEach(g => {
        const scs = MEET_SC.filter(s => s.id.startsWith(g.id + "."));
        body += `<div class="mt-guideline" data-g="${g.id}"><h3 class="mt-gh3">${g.id} ${esc(g.name)}</h3><div class="sc-list">`;
        scs.forEach(s => {
          const d = idf(s.id), removed = s.id === "4.1.1";
          const allTags = Object.values(s.tags).flat();
          const roles = Object.keys(s.tags).filter(k => s.tags[k].length);
          const c = ALL.find(x => x.id === s.id);
          body += `<article class="sc mt-sc" id="mt-${d}" data-id="${s.id}" data-level="${removed ? "removed" : s.lv}" data-roles="${roles.join(" ")}" data-topics="${esc(allTags.join(" "))}" data-text="${esc((s.id + " " + scTitle(s.id) + " " + s.how[0] + " " + (MEET_REQ[s.id] ? MEET_REQ[s.id].r : "")).toLowerCase())}">
            <h3 class="sc-h"><button type="button" class="sc-toggle mt-toggle" aria-expanded="false" aria-controls="mtb-${d}">
              <span class="sc-num">${s.id}</span><span class="sc-title">${esc(scTitle(s.id))}</span>

              <div class="sc-links">${c ? `<a href="#/${c._p.id}/${s.id}">Study notes for ${s.id}</a>` : ""}${extLink(UND + (c ? c.slug : "parsing") + ".html", "Understanding " + s.id)}${extLink("https://www.w3.org/WAI/WCAG22/quickref/#" + (c ? c.slug : "parsing"), "Quick Reference entry")}</div>
              ${roles.length ? `<p class="mt-roles"><b>Mostly for:</b> ${roles.map(r => MEET_ROLES.find(x => x[0] === r)[1]).join(", ")}${allTags.length ? ` · <b>Topics:</b> ${esc([...new Set(allTags)].map(t => t.replace(/-/g, " ")).join(", "))}` : ""}</p>` : ""}
              ${s.suf.length ? `<div class="mt-type" data-type="suf"><h4 class="mt-th mt-th-suf">${I.ok}Sufficient techniques <span class="mt-th-note">(any one that fits your situation meets it)</span></h4>${meetBlocks(s.suf)}</div>` : ""}

        });

      });
      body += `</section>`;
    });

    app.innerHTML = `<div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="#/">Home</a></li><li><span aria-current="page">How to meet</span></li></ol></nav>

        <div class="p-meta">${extLink("https://www.w3.org/WAI/WCAG22/quickref/", "W3C Quick Reference")} ${extLink("https://www.w3.org/WAI/WCAG22/Understanding/understanding-techniques", "Understanding techniques")}</div>
      </header>

      <div class="mt-intro">
        <div class="g-aside"><h2 class="ci-h" style="font-size:1.05rem">How to read each entry</h2>
          <dl class="mt-key">
            <dt>${I.ok} Sufficient techniques</dt><dd>Recognised ways to meet the criterion. Using one that fits your situation is enough. Other ways can also meet it; these are just the documented ones.</dd>
            <dt>Situations</dt><dd>Some criteria depend on what your content is (an image vs a chart, normal vs large text). Pick the situation that matches, then use its techniques.</dd>
            <dt>${I.star} Advisory techniques</dt><dd>Extra good practice that improves accessibility but doesn't meet the criterion by itself.</dd>
            <dt>${I.x} Failures</dt><dd>Known mistakes. If one of these happens, the criterion fails, whatever else you've done.</dd>
          </dl></div>
        <div class="g-aside"><h2 class="ci-h" style="font-size:1.05rem">Technique codes</h2>
          <ul class="mt-codes"><li><b>G</b> General, any technology</li><li><b>H</b> HTML</li><li><b>C</b> CSS</li><li><b>ARIA</b> WAI-ARIA</li><li><b>SCR</b> Client-side script</li><li><b>SVR</b> Server-side script</li><li><b>SM</b> SMIL media</li><li><b>PDF</b> PDF documents</li><li><b>T</b> Plain text</li><li><b>F</b> Failure</li></ul>
          <p style="margin:.6rem 0 0;font-size:.93rem;color:var(--muted)">Each code links to the full W3C technique.</p></div>
      </div>

      <div class="mt-filters" role="search" aria-label="Filter criteria">
        <div class="grp" role="group" aria-labelledby="mf-role"><span class="grp-label" id="mf-role">Role</span>${MEET_ROLES.map(r => chip("role", r[0], r[1], false)).join("")}</div>
        <div class="grp" role="group" aria-labelledby="mf-lvl"><span class="grp-label" id="mf-lvl">Level</span>${["A","AA","AAA"].map(l => chip("lvl", l, l, true)).join("")}</div>
        <div class="grp" role="group" aria-labelledby="mf-type"><span class="grp-label" id="mf-type">Show</span>${[["suf","Sufficient"],["adv","Advisory"],["fail","Failures"]].map(t => chip("type", t[0], t[1], true)).join("")}</div>
        <div class="grp" role="group" aria-labelledby="mf-tech"><span class="grp-label" id="mf-tech">Technology</span>${MEET_TECHS.map(t => chip("tech", t[0], t[1], true)).join("")}</div>

          <label for="mf-topic" class="grp-label">Topic</label>
          <select id="mf-topic" class="mt-select"><option value="">All topics</option>${topics.map(t => `<option value="${esc(t)}">${esc(t.replace(/-/g, " "))}</option>`).join("")}</select>
          <label for="mf-q" class="grp-label">Filter by word</label>

        </div>
        <div class="grp"><p class="status" id="mf-status" role="status" style="margin:0"></p><span class="spacer"></span><button type="button" class="linkbtn" id="mf-expand">Expand all shown</button><button type="button" class="linkbtn" id="mf-reset">Reset filters</button></div>

    </div>`;

    const apply = () => {
      let shown = 0;
      app.querySelectorAll(".mt-sc").forEach(a => {
        const lv = a.dataset.level;
        const okL = lv === "removed" ? meetState.levels.has("A") : meetState.levels.has(lv);
        const okR = !meetState.roles.size || a.dataset.roles.split(" ").some(r => meetState.roles.has(r));
        const okT = !meetState.topic || a.dataset.topics.split(" ").includes(meetState.topic);
        const okQ = !meetState.q || a.dataset.text.includes(meetState.q) || a.querySelector(".mt-body").textContent.toLowerCase().includes(meetState.q);
        const vis = okL && okR && okT && okQ;
        a.hidden = !vis; if (vis) shown++;
        a.querySelectorAll(".mt-type").forEach(t => t.hidden = !meetState.types.has(t.dataset.type));
        a.querySelectorAll("li[data-tech]").forEach(li => { const p = li.dataset.tech.split(" ").filter(Boolean); li.hidden = p.length > 0 && !p.some(x => x === "F" || meetState.techs.has(x)); });
      });
      app.querySelectorAll(".mt-guideline").forEach(g => g.hidden = !g.querySelector(".mt-sc:not([hidden])"));
      app.querySelectorAll(".mt-principle").forEach(p => p.hidden = !p.querySelector(".mt-sc:not([hidden])"));
      document.getElementById("mf-status").textContent = `Showing ${shown} of ${MEET_SC.length} criteria`;
      document.getElementById("mt-empty").hidden = shown !== 0;
    };
    const setOpen = (a, open) => { const b = a.querySelector(".mt-toggle"); b.setAttribute("aria-expanded", String(open)); a.querySelector(".mt-body").hidden = !open; a.classList.toggle("is-open", open); };

      const a = b.closest(".mt-sc"), open = b.getAttribute("aria-expanded") !== "true";

    });

      const c = e.target.closest("[data-mf]"); if (!c) return;

    document.getElementById("mf-expand").addEventListener("click", e => {

    });

      meetState.roles.clear(); meetState.levels = new Set(["A","AA","AAA"]); meetState.types = new Set(["suf","adv","fail"]); meetState.techs = new Set(MEET_TECHS.map(t => t[0])); meetState.topic = ""; meetState.q = "";

      document.getElementById("mf-topic").value = ""; document.getElementById("mf-q").value = "";
      apply();
    });

    app.querySelectorAll("[data-mf]").forEach(c => { const set = {role:meetState.roles, lvl:meetState.levels, type:meetState.types, tech:meetState.techs}[c.dataset.mf]; c.setAttribute("aria-pressed", String(set.has(c.dataset.v))); });
    document.getElementById("mf-topic").value = meetState.topic; document.getElementById("mf-q").value = meetState.q;
    apply();
    return { open: id => { const a = document.getElementById("mt-" + idf(id)); if (!a) return null; if (a.hidden){ meetState.levels = new Set(["A","AA","AAA"]); meetState.roles.clear(); meetState.topic = ""; meetState.q = ""; document.getElementById("mf-reset").click(); } setOpen(a, true); return a; } };
  }

  const AUDIT_CHECK = [

  function renderAudit(){
    const toc = [["plan","Plan the audit"],["setup","Set up your test environment"],["workflow","Run the audit in this order"],["findings","Write findings developers can act on"],["severity","Rate severity"],["fail-or-bp","Failure or best practice?"],["pitfalls","Common auditing mistakes"],["retest","Retest after fixes"],["checklist","Audit checklist"]];
    const H = (id, title) => `<h2 id="audit-${id}" tabindex="-1" class="a-h">${esc(title)}</h2>`;
    const table = (label, head, rows) => `<div class="tbl" role="region" aria-label="${esc(label)}" tabindex="0"><table><caption class="visually-hidden">${esc(label)}</caption><thead><tr>${head.map(h => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr><th scope="row">${esc(r[0])}</th>${r.slice(1).map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

    app.innerHTML = `<div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="#/">Home</a></li><li><span aria-current="page">Audit guide</span></li></ol></nav>
      <header class="p-hero" style="grid-template-columns:1fr">
        <h1 id="p-h1" tabindex="-1">Audit guide</h1>
        <p class="p-statement">How to plan, run and report a WCAG 2.2 audit that developers trust: what to test, in what order, how to write each finding, and how to tell failures from best practice.</p>
      </header>

      <div class="audit">
        <nav class="a-toc" aria-labelledby="toc-h"><h2 id="toc-h">On this page</h2><ol>${toc.map(t => `<li><a href="#/audit/${t[0]}">${esc(t[1])}</a></li>`).join("")}</ol></nav>

        <div class="a-body">
        <section aria-labelledby="audit-plan">${H("plan","Plan the audit")}
          <p>Most weak audits fail before testing starts, because nobody agreed what was being tested. Settle these first and write them at the top of the report.</p>
          <ul>
            <li><b>Conformance target.</b> Usually WCAG 2.2 Level AA, which means every A and AA criterion. Note AAA findings separately, if at all.</li>

            <li><b>States.</b> Logged in and out, empty, loading, error, success, open menus and dialogs, mobile layouts, dark mode.</li>

          ])}
          <p style="margin-top:1rem">Before you start: reset browser zoom to 100%, turn off extensions that change pages (ad blockers can hide content), and note browser and AT versions in the report.</p>

        <section aria-labelledby="audit-workflow">${H("workflow","Run the audit in this order")}
          <p>This order finds the biggest barriers first and stops you re-testing the same thing twice. Each step lists the criteria it mainly covers.</p>
          <ol class="steps">
            <li><span><b>Automated scan.</b> Run axe or WAVE on every sampled page and state. Log confirmed violations; treat “needs review” items as a to-do list, not results. <span class="scs">1.1.1, 1.3.1, 1.4.3, 2.4.2, 3.1.1, 4.1.2</span></span></li>

            <li><span><b>Media, motion and time.</b> Captions, audio description, transcripts, autoplay, carousels, timeouts and anything that flashes. <span class="scs">1.2.x, 1.4.2, 2.2.1, 2.2.2, 2.3.1</span></span></li>
            <li><span><b>Touch and pointer.</b> On a real device: target sizes, gestures, dragging, pointer cancellation. <span class="scs">2.5.1, 2.5.2, 2.5.4, 2.5.7, 2.5.8</span></span></li>
            <li><span><b>Across pages.</b> Compare templates for consistent navigation, naming and help; check multiple ways to find pages, redundant entry and authentication. <span class="scs">2.4.5, 3.2.3, 3.2.4, 3.2.6, 3.3.4, 3.3.7, 3.3.8</span></span></li>
          </ol>
        </section>

        <section aria-labelledby="audit-findings">${H("findings","Write findings developers can act on")}
          <p>A finding is only useful if a developer can reproduce it, understand why it matters and fix it without asking you. Use the same five fields every time, plus severity.</p>
          <ul>
            <li><b>One issue per finding.</b> If the same root cause appears on 30 pages, write one finding and list the instances or the component name.</li>
            <li><b>Cite the most specific criterion.</b> Add a second criterion only when it's a genuinely separate failure, not to pad the report.</li>
            <li><b>Make it reproducible.</b> Page URL, element or selector, steps, what you heard or saw, and the browser and AT pairing.</li>
            <li><b>Describe the user impact</b> in one sentence: who is blocked or slowed, and how.</li>
            <li><b>Recommend the simplest correct fix,</b> preferring native HTML over ARIA, with a code snippet when it helps.</li>
          </ul>
          <div class="examples" style="margin-top:1rem">
            <div class="ex good"><div class="ex-h">${I.ok}Example finding</div>
<pre tabindex="0" aria-label="Example finding"><code>${esc(`Issue title: "Add to cart" icon button on product cards has no accessible name

Issue description: On /shop, each product card's cart icon button
(.product-card button.add-cart) contains only an SVG and no text,
aria-label or aria-labelledby. NVDA + Chrome 129 announces "button".
Screen reader and voice control users can't tell what the button
does or which product it adds.
Steps: Tab to the first product card's cart icon; listen.

Expected result: The button is announced with its purpose and
product, e.g. "Add Blue hoodie to cart, button".

SC & Level: 4.1.2 Name, Role, Value (Level A)

Recommendation: Give the button an accessible name and hide the icon:
<button class="add-cart" aria-label="Add Blue hoodie to cart">
  <svg aria-hidden="true" focusable="false">...</svg>
</button>

Severity: High`)}</code></pre></div>
          </div>
          <p style="margin-top:1rem"><button type="button" class="linkbtn" data-copy="template">${I.copy} Copy blank finding template</button> <span role="status" class="copy-status"></span></p>
        </section>

        <section aria-labelledby="audit-severity">${H("severity","Rate severity")}
          <p>Severity combines how badly a barrier affects people with how important the task is. A contrast issue in the checkout button matters more than the same issue in the footer.</p>
          ${table("Severity levels", ["Severity","Meaning","Typical examples"], [
            ["Blocker","Some users can't complete a key task at all, with no workaround","Keyboard trap, unlabelled checkout button, CAPTCHA with no alternative, flashing content"],
            ["High","The task is possible only with major difficulty, or important information is lost","Missing form labels, errors not announced, no captions on a key video, focus not visible"],
            ["Medium","Noticeable friction, but a reasonable workaround exists","Low-contrast helper text, confusing focus order in one section, vague link text"],
            ["Low","Minor annoyance, isolated, or a best-practice recommendation","Skipped heading level, redundant title attribute, 30px targets that pass AA"]
          ])}
        </section>

        <section aria-labelledby="audit-fail-or-bp">${H("fail-or-bp","Failure or best practice?")}
          <p>Credibility depends on this. A failure means the content does not meet a success criterion. A best practice makes things better, but citing an SC for it invites pushback and weakens the real findings. Label best practices clearly and give them Low severity or a separate section.</p>
          <p>Commonly mis-reported as failures:</p>
          <ul class="bp">
            <li><b>No &lt;h1&gt; or skipped heading levels.</b> Best practice, unless the headings don't reflect the real structure (then 1.3.1).</li>
            <li><b>No skip link.</b> 2.4.1 can also be met with landmarks or headings. Recommend the skip link; fail 2.4.1 only if no bypass method exists.</li>
            <li><b>Positive tabindex.</b> Fails 2.4.3 only if the resulting order loses meaning or operability.</li>
            <li><b>Links opening a new tab without warning.</b> Best practice at AA (3.2.5 is AAA).</li>
            <li><b>Targets between 24 and 44 px.</b> Pass 2.5.8; recommend 44 px (2.5.5 is AAA).</li>
            <li><b>Low-contrast disabled controls and logos.</b> Exempt from 1.4.3 and 1.4.11.</li>
            <li><b>Muted autoplay video.</b> Not 1.4.2 (no audio), though it may fail 2.2.2 if it moves for more than 5 seconds with no pause.</li>
            <li><b>Alt text starting with “image of”.</b> Best practice, unless the alt fails to serve the same purpose.</li>
            <li><b>axe rules tagged best-practice</b> (region, landmark-one-main, heading-order, page-has-heading-one). Report as best practice, not WCAG failures.</li>
          </ul>
          <p>Each criterion page in a11ywallet now has a <b>Best practice</b> section listing recommendations like these for that criterion.</p>
        </section>

        <section aria-labelledby="audit-pitfalls">${H("pitfalls","Common auditing mistakes")}
          <ul>
            <li><b>Trusting the scanner.</b> Automated tools catch only a minority of WCAG issues (estimates are commonly around a third). “No axe violations” never means “accessible”.</li>
            <li><b>Testing only the homepage</b> or only the happy path. Errors, empty states and logged-in screens hide the worst bugs.</li>
            <li><b>Screen reader testing with your eyes.</b> Close your eyes or turn the screen off (NVDA screen curtain, VoiceOver screen curtain) for a real walk-through.</li>
            <li><b>Using one screen reader and browser only.</b> Some bugs appear only in one pairing.</li>
            <li><b>Recommending ARIA where native HTML would fix it.</b> Bad ARIA often makes things worse.</li>
            <li><b>Accepting overlays as a fix.</b> Accessibility overlay widgets don't fix the underlying code, and some add new barriers.</li>
            <li><b>Retesting only the reported element.</b> Check every instance of the component and the pattern it came from.</li>
          </ul>
        </section>

        <section aria-labelledby="audit-retest">${H("retest","Retest after fixes")}
          <ul>
            <li><b>Use the same steps and environment</b> as the original finding (page, browser, assistive technology and versions).</li>
            <li><b>Check every instance</b> of the component, not just the one you reported, and the shared component it comes from.</li>
            <li><b>Re-run the scanner</b> (axe or WAVE) on the affected pages to confirm nothing new was introduced.</li>
            <li><b>Check nearby behaviour:</b> a fixed dialog label is no use if the fix broke focus return.</li>
            <li><b>Record the result</b> against the finding: fixed, partly fixed (with what's left), or not fixed.</li>
          </ul>
        </section>

        <section aria-labelledby="audit-checklist">${H("checklist","Audit checklist")}
          <p>What a complete audit covers, for reference.</p>
          <ul class="checkref">${AUDIT_CHECK.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        </section>
        </div>
      </div>
    </div>`;
  }

  /* ---------- principle ---------- */
  function counts(list){ const c = {A:0, AA:0, AAA:0}; list.forEach(x => c[x.level]++); return c; }

  function scHTML(c){
    const k = c.id, d = idf(k);
    const sec = (icon, title, body, cls) => `<div class="sec ${cls || ""}"><h4>${icon}${esc(title)}</h4>${body}</div>`;

    let body = `<div class="sc-links">
        ${extLink(UND + c.slug + ".html", "Understanding " + k)}
        ${extLink(SPEC + "#" + c.slug, "Normative text in WCAG 2.2")}
        <a href="#/meet/${k}">How to meet ${k}</a>
      </div>`;
    body += sec(I.eye, "What it means", `<p class="lead">${esc(c.intent)}</p>`);
    body += sec(I.people, "Who this helps", `<ul class="who">${c.who.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`);
    body += sec(I.list, "What to check",
      `<ul class="checkref">${c.check.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`);
    body += sec(I.flask, "How to test", `<ol class="steps">${c.how.map(t => `<li><span>${esc(t)}</span></li>`).join("")}</ol>`);
    if (c.tools && c.tools.length) body += sec(I.wrench, "Tools", `<ul class="toolchips">${c.tools.map(key => { const t = TOOLS[key]; if (!t) return ""; return `<li>${t.url ? extLink(t.url, t.name) : `<span>${esc(t.name)}</span>`}</li>`; }).join("")}</ul>`);

    let f = "";
    if (c.scenarios && c.scenarios.length) f += `<p>Real-world failure scenarios:</p><ul class="scenario">${c.scenarios.map(s => `<li><strong>${esc(s[0])}.</strong> ${esc(s[1])}</li>`).join("")}</ul>`;
    if (c.fails && c.fails.length) f += `<p style="margin-top:1rem">Documented W3C failures:</p><ul>${c.fails.map(x => `<li><a class="fcode" href="${techUrl(x[0])}" target="_blank" rel="noopener">${x[0]}<span class="visually-hidden"> (opens in a new tab)</span></a> ${esc(x[1])}</li>`).join("")}</ul>`;
    if (f) body += sec(I.warn, "Common failures", `<div class="fails">${f}</div>`);

    if (c.ex){
      const block = (kind, code, note) => code ? `<div class="ex ${kind}">
          <div class="ex-h">${kind === "bad" ? I.x + "Fails" : I.ok + "Passes"}</div>
          <pre tabindex="0" aria-label="${kind === "bad" ? "Failing" : "Passing"} code example for ${k}"><code>${esc(code)}</code></pre>
          ${note ? `<p>${esc(note)}</p>` : ""}
        </div>` : "";
      body += sec(I.code, "Code examples", `<div class="examples">${block("bad", c.ex.bad, c.ex.badNote)}${block("good", c.ex.good, c.ex.goodNote)}</div>`, "wide");
    }
    if (c.pairs && c.pairs.length){
      const pb = (kind, title, text, code) => `<div class="ex ${kind}">
          <div class="ex-h">${kind === "bad" ? I.x + "Fails" : I.ok + "Passes"}${title ? ": " + esc(title) : ""}</div>
          ${code ? `<pre tabindex="0" aria-label="${kind === "bad" ? "Failing" : "Passing"} example: ${esc(title || k)}"><code>${esc(code)}</code></pre>` : ""}
          ${text ? `<p>${esc(text)}</p>` : ""}
        </div>`;
      body += sec(I.code, "More pass and fail examples", c.pairs.map(pr => `<div class="examples" style="margin-bottom:1rem">${pr.pass || pr.passCode ? pb("good", pr.t, pr.pass, pr.passCode) : ""}${pr.fail || pr.failCode ? pb("bad", pr.t, pr.fail, pr.failCode) : ""}</div>`).join(""), "wide");
    }
    if (c.tech && c.tech.length) body += sec(I.book, "Sufficient and advisory techniques", `<ul class="techs">${c.tech.map(x => { const u = techUrl(x[0]); return `<li>${u ? `<a class="fcode" href="${u}" target="_blank" rel="noopener">${x[0]}<span class="visually-hidden"> (opens in a new tab)</span></a>` : `<span class="fcode">${x[0]}</span>`} ${esc(x[1])}</li>`; }).join("")}</ul>`);
    if (c.exc && c.exc.length) body += sec(I.gate, "Exceptions and scope", `<ul>${c.exc.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);
    if (c.bp && c.bp.length) body += sec(I.star, "Best practice (beyond the requirement)", `<p class="bp-note">Recommend these in an audit, but label them as best practice. On their own they are not failures of ${k}.</p><ul class="bp">${c.bp.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);
    if (c.tip) body += `<div class="sec callout"><h4>${I.bulb}QA tip</h4><p>${esc(c.tip)}</p></div>`;

    body += `<div class="learn-row"><div class="navbtn"><button type="button" class="linkbtn" data-collapse="${k}">Collapse ${k}</button></div></div>`;

    return `<article class="sc" id="sc-${d}" data-level="${c.level}" data-id="${k}">
      <h3 class="sc-h">
        <button type="button" class="sc-toggle" id="scbtn-${d}" aria-expanded="false" aria-controls="scb-${d}">
          <span class="sc-num">${k}</span>
          <span class="sc-title">${esc(c.title)}</span>
          <span class="sc-flags"><span class="badge lvl-${c.level}">Level ${c.level}</span></span>
          ${I.chev}
        </button>
      </h3>
      <p class="sc-sum">${esc(c.s)}</p>
      <div class="sc-body" id="scb-${d}" hidden>${body}</div>
    </article>`;
  }

  function panelHTML(p, g){
    const n = g.criteria.length, c = counts(g.criteria);
    const d = idf(g.id);
    return `<div class="g-head">
        <div>
          <h2 id="gh-${d}">${g.id} ${esc(g.name)}</h2>
          <p class="g-desc">${esc(g.desc)}</p>
          <p class="g-why">${esc(g.why)}</p>
        </div>
        <div class="g-aside">
          <h3 id="ga-${d}">At a glance</h3>
          <p style="margin:0 0 .6rem">${plural(n, "criterion", "criteria")}: ${["A","AA","AAA"].filter(l => c[l]).map(l => `<span class="badge lvl-${l}">${c[l]} ${l}</span>`).join(" ")}</p>
          <ul>${(g.kit || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
          <div class="links">
            ${extLink(UND + g.slug + ".html", "Understanding Guideline " + g.id)}
            ${extLink(SPEC + "#" + g.slug, "Guideline " + g.id + " in WCAG 2.2")}
          </div>
        </div>
      </div>
      ${g.note ? `<div class="callout" style="margin-bottom:1.25rem"><h3 style="font-size:1.05rem;margin-bottom:.35rem;display:flex;gap:.5rem;align-items:center">${I.warn}${esc(g.note.title)}</h3><p style="margin:0">${esc(g.note.text)}</p></div>` : ""}
      ${(g.removed || []).map(r => `<div class="removed"><p class="removed-h"><span class="sc-num">${r.id}</span> <b>${esc(r.title)}</b> <span class="removed-tag">Removed in WCAG 2.2</span></p><p>${esc(r.text)}</p>${r.tip ? `<p><b>Still good practice:</b> ${esc(r.tip)}</p>` : ""}<p style="margin:0">${extLink(UND + r.slug + ".html", "Understanding " + r.id + " (obsolete)")}</p></div>`).join("")}
      <div class="toolbar">
        <div class="grp" role="group" aria-labelledby="lf-${d}">
          <span class="grp-label" id="lf-${d}">Show levels</span>
          ${["A","AA","AAA"].map(l => `<button type="button" class="chip" data-level-toggle="${l}" aria-pressed="${levels[l]}">${I.tick}${l}</button>`).join("")}
        </div>
        <p class="status" id="st-${d}" role="status" style="margin:0"></p>
        <span class="spacer"></span>
        <button type="button" class="linkbtn" data-expand-all="${g.id}">Expand all</button>
      </div>
      <div class="sc-list">${g.criteria.map(scHTML).join("")}</div>
      <p class="empty" data-empty="${g.id}" hidden>No criteria match the selected levels. Turn a level back on to see them.</p>`;
  }

  function renderPrinciple(p){
    const all = p.guidelines.flatMap(g => g.criteria);
    const c = counts(all);
    const crumbs = `<nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="#/">Home</a></li><li><a href="#/wcag">WCAG 2.2</a></li><li><span aria-current="page">${p.num}. ${esc(p.name)}</span></li></ol></nav>
      <nav class="subnav" aria-label="WCAG principles"><ul>${PRINCIPLES.map(x => `<li><a href="#/${x.id}"${x.id === p.id ? ' aria-current="page"' : ""}>${x.num}. ${esc(x.name)}</a></li>`).join("")}</ul></nav>`;
    let html = `<div class="wrap">${crumbs}
      <header class="p-hero">
        <span class="p-num" aria-hidden="true">${p.num}</span>
        <h1 id="p-h1" tabindex="-1"><span class="visually-hidden">Principle ${p.num}: </span>${esc(p.name)}</h1>
        <p class="p-statement">${esc(p.statement)}</p>
        <div class="p-meta">
          ${all.length ? `<div class="counts">${plural(all.length, "success criterion", "success criteria")}: ${["A","AA","AAA"].filter(l => c[l]).map(l => `<span class="badge lvl-${l}">${c[l]} at ${l}</span>`).join(" ")}</div>` : `<div>Study notes for this principle are on the way.</div>`}
          ${extLink(SPEC + "#" + p.slug, "Principle " + p.num + " in WCAG 2.2")}
        </div>
      </header>
      ${p.blurb ? `<p style="max-width:68ch;font-size:1.08rem;margin:-.5rem 0 2rem">${esc(p.blurb)}</p>` : ""}`;

    if (p.soon){
      html += `<h2 style="font-size:1.4rem">Guidelines in this principle</h2>
        <ul class="soon-list">${p.guidelines.map(g => `<li><b>${g.id}</b> ${esc(g.name)} <span>Notes coming soon.</span> ${extLink(SPEC + "#" + g.slug, "Read at W3C")}</li>`).join("")}</ul>`;
    } else {
      html += `<div class="tabs">
        <div class="tablist" role="tablist" aria-label="${esc(p.name)} guidelines">
          ${p.guidelines.map((g, i) => `<button type="button" role="tab" class="tab" id="tab-${idf(g.id)}" aria-controls="panel-${idf(g.id)}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}" data-gid="${g.id}">
              <span class="t-id">${g.id}</span><span class="t-name">${esc(g.name)}</span><span class="t-count">${plural(g.criteria.length, "criterion", "criteria")}</span>
            </button>`).join("")}
        </div>
        ${p.guidelines.map((g, i) => `<div role="tabpanel" class="tabpanel" id="panel-${idf(g.id)}" aria-labelledby="tab-${idf(g.id)}" tabindex="0"${i === 0 ? "" : " hidden"}>${panelHTML(p, g)}</div>`).join("")}
      </div>`;
    }
    html += `</div>`;
    app.innerHTML = html;
    if (!p.soon){ applyLevels(); }
  }

  /* ---------- behaviours ---------- */
  function currentPrinciple(){ return PRINCIPLES.find(p => p.id === app.dataset.view); }

  function selectTab(gid, opts){
    opts = opts || {};
    const tabs = app.querySelectorAll('[role="tab"][data-gid]');
    tabs.forEach(t => {
      const on = t.dataset.gid === gid;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
      if (on && opts.focus) t.focus();
    });
    const p = currentPrinciple(), g = p && p.guidelines.find(x => x.id === gid);
    if (g) document.title = `${g.id} ${g.name} | ${p.name} | a11ywallet`;
    if (opts.hash) history.replaceState(null, "", `#/${p.id}/${gid}`);
  }

  function setOpen(article, open){
    const btn = article.querySelector(".sc-toggle"), body = article.querySelector(".sc-body");
    btn.setAttribute("aria-expanded", open);
    body.hidden = !open;
    article.classList.toggle("is-open", open);
  }

  function openSC(id, focus){
    const a = document.getElementById("sc-" + idf(id));
    if (!a) return;
    if (a.hidden){ levels[a.dataset.level] = true; store.set("levels", levels); applyLevels(); }
    setOpen(a, true);
    const btn = a.querySelector(".sc-toggle");
    requestAnimationFrame(() => {
      a.scrollIntoView({block:"start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
      if (focus) btn.focus({preventScroll:true});
    });
  }

  function applyLevels(){
    app.querySelectorAll("[data-level-toggle]").forEach(b => b.setAttribute("aria-pressed", !!levels[b.dataset.levelToggle]));
    app.querySelectorAll('[role="tabpanel"]').forEach(panel => {
      const items = panel.querySelectorAll(".sc");
      let shown = 0;
      items.forEach(a => { const vis = !!levels[a.dataset.level]; a.hidden = !vis; if (vis) shown++; });
      const st = panel.querySelector(".status");
      if (st) st.textContent = `Showing ${shown} of ${plural(items.length, "criterion", "criteria")}`;
      const empty = panel.querySelector("[data-empty]");
      if (empty) empty.hidden = shown !== 0;
    });
  }

  app.addEventListener("click", e => {
    const tab = e.target.closest('[role="tab"][data-gid]');
    if (tab){ selectTab(tab.dataset.gid, {hash:true}); return; }

    const tog = e.target.closest(".sc-toggle:not(.mt-toggle)");
    if (tog){
      const a = tog.closest(".sc");
      const open = tog.getAttribute("aria-expanded") !== "true";
      setOpen(a, open);
      const p = currentPrinciple();
      if (open) history.replaceState(null, "", `#/${p.id}/${a.dataset.id}`);
      return;
    }

    const col = e.target.closest("[data-collapse]");
    if (col){
      const a = document.getElementById("sc-" + idf(col.dataset.collapse));
      setOpen(a, false);
      a.querySelector(".sc-toggle").focus();
      return;
    }

    const lv = e.target.closest("[data-level-toggle]");
    if (lv){
      const l = lv.dataset.levelToggle;
      levels[l] = !levels[l];
      store.set("levels", levels);
      applyLevels();
      return;
    }

    const ex = e.target.closest("[data-expand-all]");
    if (ex){
      const panel = ex.closest('[role="tabpanel"]');
      const items = [...panel.querySelectorAll(".sc:not([hidden])")];
      const anyClosed = items.some(a => a.querySelector(".sc-toggle").getAttribute("aria-expanded") !== "true");
      items.forEach(a => setOpen(a, anyClosed));
      ex.textContent = anyClosed ? "Collapse all" : "Expand all";
      return;
    }

    const cp = e.target.closest("[data-copy]");
    if (cp){
      const st = cp.parentElement.querySelector(".copy-status");
      const ok = () => { st.textContent = "Template copied to clipboard"; };
      const fallback = () => { st.textContent = "Couldn't copy automatically. Select the example finding and copy it instead."; };
      try { navigator.clipboard.writeText(FINDING_TEMPLATE).then(ok, fallback); } catch(err){ fallback(); }
      return;
    }
  });

  app.addEventListener("keydown", e => {
    const tab = e.target.closest('[role="tab"][data-gid]');
    if (!tab) return;
    const tabs = [...app.querySelectorAll('[role="tab"][data-gid]')];
    let i = tabs.indexOf(tab);
    if (e.key === "ArrowRight") i = (i + 1) % tabs.length;
    else if (e.key === "ArrowLeft") i = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === "Home") i = 0;
    else if (e.key === "End") i = tabs.length - 1;
    else return;
    e.preventDefault();
    selectTab(tabs[i].dataset.gid, {focus:true, hash:true});
  });

  /* ---------- router ---------- */
  let first = true;
  function route(){
    const h = location.hash;
    if (h && !h.startsWith("#/")) return;          // in-page anchors
    const parts = h.replace(/^#\/?/, "").split("/").filter(Boolean);
    const p = PRINCIPLES.find(x => x.id === parts[0]);
    const sub = parts[1] || "";

    if (parts[0] !== "apg"){ clearInterval(demoTimer); clearInterval(meterTimer); }
    if (parts[0] === "apg"){
      const slug = parts[1] && APG_PATTERNS[parts[1]] ? parts[1] : "";
      const view = "apg:" + slug;
      const same = app.dataset.view === view;
      if (!same){ app.dataset.view = view; renderNav("apg"); slug ? renderPattern(slug) : renderApgHome(); window.scrollTo(0, 0); }
      document.title = (slug ? APG_PATTERNS[slug].name + " pattern | APG" : "APG patterns") + " | a11ywallet";
      const target = slug && parts[2] && document.getElementById("apg-" + parts[2]);
      if (target){ target.scrollIntoView(); if (!first) target.focus({preventScroll:true}); }
      else if (!first && !same) document.getElementById("p-h1").focus();
      first = false; return;
    }
    if (parts[0] === "meet"){
      if (app.dataset.view !== "meet"){ app.dataset.view = "meet"; renderNav("meet"); window.__meet = renderMeet(); window.scrollTo(0, 0); }
      document.title = "How to meet WCAG 2.2 | a11ywallet";
      const target = parts[1] && window.__meet && window.__meet.open(parts[1]);
      if (target){ requestAnimationFrame(() => { target.scrollIntoView({block:"start"}); if (!first) target.querySelector(".mt-toggle").focus({preventScroll:true}); }); }
      else if (!first) document.getElementById("p-h1").focus();
      first = false; return;
    }
    if (parts[0] === "wcag"){
      if (app.dataset.view !== "wcag"){ app.dataset.view = "wcag"; renderNav("wcag"); renderWcagHome(); window.scrollTo(0, 0); }
      document.title = "WCAG 2.2 study notes | a11ywallet";
      if (!first) document.getElementById("home-h1").focus();
      first = false; return;
    }
    if (parts[0] === "audit"){
      const same = app.dataset.view === "audit";
      if (!same){ app.dataset.view = "audit"; renderNav("audit"); renderAudit(); window.scrollTo(0, 0); }
      document.title = "Audit guide | a11ywallet";
      const target = sub && document.getElementById("audit-" + sub);
      if (target){ target.scrollIntoView(); if (!first) target.focus({preventScroll:true}); }
      else if (!first) document.getElementById("p-h1").focus();
      first = false; return;
    }

    if (!p){
      if (app.dataset.view !== "home"){ app.dataset.view = "home"; renderNav(""); renderLanding(); window.scrollTo(0, 0); }
      document.title = "a11ywallet | Accessibility study notes";
      if (!first) document.getElementById("home-h1").focus();
      first = false; return;
    }

    const same = app.dataset.view === p.id;
    if (!same){ app.dataset.view = p.id; renderNav("wcag"); renderPrinciple(p); }
    document.title = `${p.name} | a11ywallet`;

    if (!p.soon){
      const gid = sub ? sub.split(".").slice(0, 2).join(".") : p.guidelines[0].id;
      const g = p.guidelines.find(x => x.id === gid) || p.guidelines[0];
      selectTab(g.id);
      if (sub.split(".").length === 3){ openSC(sub, !first); first = false; return; }
    }
    if (!first && !same) document.getElementById("p-h1").focus();
    if (!same) window.scrollTo(0, 0);
    first = false;
  }
  window.addEventListener("hashchange", route);

  /* ---------- skip link ---------- */
  document.getElementById("skiplink").addEventListener("click", e => { e.preventDefault(); main.focus(); });

  /* ---------- theme ---------- */
  const themeBtn = document.getElementById("theme-toggle");
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : mq.matches; };
  const savedTheme = store.get("theme", null);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  const syncTheme = () => themeBtn.setAttribute("aria-pressed", isDark());
  syncTheme();
  themeBtn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("theme", next);
    syncTheme();
  });
  mq.addEventListener && mq.addEventListener("change", syncTheme);

  /* ---------- search dialog ---------- */
  const dlg = document.getElementById("search-dialog");
  const q = document.getElementById("search-input");
  const list = document.getElementById("search-results");
  const status = document.getElementById("search-status");
  function doSearch(){
    const t = q.value.trim().toLowerCase();
    if (!t){ list.innerHTML = ""; status.textContent = ""; return; }
    const words = t.split(/\s+/);
    const pats = Object.keys(APG_PATTERNS).map(k => ({slug:k, p:APG_PATTERNS[k]})).filter(x => {
      const hay = ("apg pattern " + x.slug + " " + x.p.name + " " + x.p.summary + " " + x.p.kw).toLowerCase();
      return words.every(w => hay.includes(w));
    });
    const scs = ALL.filter(c => {
      const hay = (c.id + " " + c.title + " " + c.s + " " + (c.kw || "") + " level " + c.level).toLowerCase();
      return words.every(w => hay.includes(w));
    });
    const res = [...pats.map(x => ({pat:x})), ...scs.map(c => ({sc:c}))].slice(0, 15);
    list.innerHTML = res.map(r => r.pat
      ? `<li><a href="#/apg/${r.pat.slug}"><span class="sc-num">APG</span><span class="r-t">${esc(r.pat.p.name)} pattern</span><span></span><span class="r-sum">${esc(r.pat.p.summary)}</span></a></li>`
      : `<li><a href="#/${r.sc._p.id}/${r.sc.id}"><span class="sc-num">${r.sc.id}</span><span class="r-t">${esc(r.sc.title)}</span><span class="badge lvl-${r.sc.level}">${r.sc.level}</span><span class="r-sum">${esc(r.sc.s)}</span></a></li>`).join("");
    status.textContent = res.length ? plural(res.length, "result", "results") : "Nothing found. Try a number like 1.4, a word like contrast, or a pattern like accordion.";
    if (!res.length) list.innerHTML = `<li style="padding:.6rem .5rem;color:var(--muted)">Nothing found. Try a number like 1.4, a word like contrast, or a pattern like accordion.</li>`;
  }
  q.addEventListener("input", doSearch);
  function openSearch(){ if (!dlg.open){ dlg.showModal(); q.select(); doSearch(); } }
  document.getElementById("search-open").addEventListener("click", openSearch);
  document.getElementById("search-close").addEventListener("click", () => dlg.close());
  list.addEventListener("click", e => { if (e.target.closest("a")) dlg.close(); });
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !dlg.open && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable){
      e.preventDefault(); openSearch();
    }
  });

  route();
})();
</script>
</body></html>
