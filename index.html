/* ============================== combobox */
combobox:{
  name:"Combobox", apg:APG+"combobox/", example:APG+"combobox/examples/combobox-autocomplete-list/",
  kw:"combobox autocomplete listbox aria-activedescendant aria-expanded aria-autocomplete select-only typeahead date picker",
  summary:"An input with an attached popup (listbox, grid, tree or dialog) that helps the user choose a value.",
  what:"A combobox is an input with a popup of possible values. A select-only combobox works like a native <select>: you can only pick from the popup. An editable combobox lets you type, and typing may filter or complete suggestions (autocomplete). It's the most involved widget in APG.",
  parts:[["listbox popup","A flat list of values; the most common case."],["grid popup","Suggestions with more than one column, such as name and category."],["tree popup","Suggestions in expandable categories."],["dialog popup","A complex picker, usually a date picker."]],
  demos:[{kind:"combobox", title:"Editable combobox with list autocomplete", note:"Type “m” or “s” to filter, then use Down and Up. Nothing is selected automatically: if you type “Miss” and Tab away, “Miss” stays as the value. Escape closes the list without changing the text. The highlighted option is scrolled into view by script, because aria-activedescendant doesn't do that."}],
  sections:[
    {id:"activedescendant", title:"The core mechanic: aria-activedescendant", html:"<p><b>DOM focus never leaves the input.</b> When the user arrows into the popup, script updates <code>aria-activedescendant</code> on the input to the id of the highlighted option. Screen readers announce that option as if it were focused. This lets the user keep typing while browsing suggestions.</p><p><b>Audit check:</b> browsers don't scroll an element into view just because it's the active descendant. In long lists or at high zoom, the highlighted option can be off-screen unless the widget's script scrolls it into view on every key press. This is a common, easily missed defect.</p>"},
    {id:"autocomplete", title:"The four autocomplete behaviours", table:{caption:"aria-autocomplete values", head:["Behaviour","aria-autocomplete","Example"], rows:[["Suggestions never change with typing","none","A list of recent searches"],["Suggestions filter; nothing auto-selected","list","US state field with manual selection"],["Suggestions filter; first match auto-selected","list (with automatic selection)","Same field, but the first match becomes the value on blur"],["Filter plus inline completion after the cursor","both","US state field with highlighted completion text"]]}, after:"<p><b>Escape always means “stop exploring, keep what I had”.</b> It closes the popup without changing the value. That safe browsing is what separates a combobox from a listbox, where moving through options changes the selection immediately.</p>"},
    {id:"examples", title:"The APG examples compared", table:{caption:"APG combobox examples", head:["Example","Editable","Popup","aria-autocomplete","Notable feature"], rows:[["Select-only","No","listbox","–","Typing jumps to matching options, like a native select"],["List and inline autocomplete","Yes","listbox","both","Inline completion after the cursor"],["List autocomplete","Yes","listbox","list","Filters as you type; nothing auto-selected"],["No autocomplete","Yes","listbox","none","Suggestions never change"],["Grid popup","Yes","grid","list","Rows with several columns; Enter commits the first cell of the row"],["Date picker","Yes","dialog","none","Focus moves into a calendar dialog with its own grid"]]}},
    {id:"other-popups", title:"Grid and dialog popups", html:"<p><b>Grid:</b> the input sets <code>aria-haspopup=\"grid\"</code>, and <code>aria-activedescendant</code> points at grid cells; arrows move in two dimensions.</p><p><b>Dialog (date picker):</b> the input sets <code>aria-haspopup=\"dialog\"</code>, and unlike other popups, <b>focus actually moves into the dialog</b>, because dialogs don't use aria-activedescendant. Inside, the calendar is a grid with roving tabindex. The month and year heading is a polite live region; weekday headers use <code>abbr</code> (“Su” with abbr=\"Sunday\"); Cancel closes without changing the value, OK commits it.</p>"},
    {id:"compare", title:"Combobox, listbox or menu button?", table:{caption:"Combobox vs listbox vs menu button", head:["","Combobox","Listbox","Menu button"], rows:[["Value shown as text","Yes, can be selected and copied","No","No persistent value"],["Browse without committing","Yes; Escape is a safe undo","No; selection follows focus","Yes"],["Supports aria-required","Yes","Yes","No"],["Best for","One value from a large or filterable set","A small, always-visible set","Triggering actions"]]}}
  ],
  keyboardTables:[
    {title:"While focus is in the input", rows:[["Down Arrow","Opens the popup if closed; if open, moves the active option down."],["Up Arrow (optional)","Moves the active option up; may open the popup on the last item."],["Alt + Down Arrow (optional)","Opens the popup without moving the active option."],["Escape","Closes the popup, keeping the value. If already closed, may clear the field."],["Enter","Accepts the active option and closes the popup."],["Printable characters","Editable: type and filter. Select-only: jump to the first option starting with those characters."]]},
    {title:"While an option is active in the popup", rows:[["Down / Up Arrow","Moves the active option."],["Left / Right Arrow","Editable: returns to text editing and moves the caret; doesn't navigate the popup."],["Enter","Commits the active option and closes the popup."],["Home / End (optional)","First or last option, or (editable) moves the caret to the start or end."]]}
  ],
  roles:[
    ["Input","role=\"combobox\"","Identifies the combobox. Implies aria-haspopup=\"listbox\"; override only for grid, tree or dialog."],
    ["Input","aria-expanded=\"true\" / \"false\"","Whether the popup is showing."],
    ["Input","aria-controls=\"popup-id\"","Points at the popup. Old ARIA 1.0 code used aria-owns."],
    ["Input","aria-activedescendant=\"option-id\"","The highlighted option; empty when none."],
    ["Input (editable)","aria-autocomplete=\"none\" / \"list\" / \"both\"","Declares the filtering behaviour."],
    ["Input","<label>, aria-labelledby or aria-label","A name that's separate from the current value."],
    ["Popup","role=\"listbox\" / \"grid\" / \"tree\" / \"dialog\"","The popup's own widget type."],
    ["Options","role=\"option\", aria-selected=\"true\" on the chosen one","Marks the current value."],
    ["Open button (if any)","tabindex=\"-1\" with aria-label","Out of the tab order (the input already opens the popup by keyboard) but named for touch screen reader users."]
  ],
  code:[{label:"Editable combobox with list autocomplete", code:String.raw`<label for="state">US state</label>
<input id="state" role="combobox" aria-expanded="false"
       aria-autocomplete="list" aria-controls="state-list" aria-activedescendant="">
<ul id="state-list" role="listbox" aria-label="States" hidden>
  <li role="option" id="opt-0">Michigan</li>
  <li role="option" id="opt-1">Minnesota</li>
</ul>

function highlight(option) {
  input.setAttribute('aria-activedescendant', option.id);
  option.scrollIntoView({ block: 'nearest' });   // browsers won't do this for you
}`}],
  mistakes:[
    ["Active option doesn't scroll into view","aria-activedescendant doesn't trigger scrolling."],
    ["aria-expanded wrong","Says false while the popup is visible, or the reverse."],
    ["Escape changes the value","Breaks safe browsing of suggestions."],
    ["No name, or the value used as the name","Users hear “Michigan” with no idea what the field is."],
    ["aria-owns in new code","Use aria-controls (ARIA 1.2)."],
    ["Open button is a tab stop with no name","It should be tabindex=\"-1\" but still named."],
    ["Combobox where a simpler pattern fits","No filtering or free text? A native select, listbox or menu button may be better."]
  ],
  good:"A labelled input with role=\"combobox\", aria-expanded and aria-controls kept accurate, aria-activedescendant pointing at a visibly highlighted option that is scrolled into view, and Escape that never loses the user's value.",
  wcag:[["4.1.2","Name, role, expanded state and value are exposed."],["2.1.1","Opening, filtering, choosing and cancelling all work by keyboard."],["2.4.7","The active option is visibly highlighted, since real focus stays in the input."],["2.5.3","The visible label is part of the accessible name."],["1.4.13","Suggestion popups that appear on focus can be dismissed with Escape."],["4.1.3","Result counts or date picker month changes are announced without moving focus."]],
  quiz:[
    {q:"Where is DOM focus while the user arrows through combobox suggestions?", o:["On each option","On the input, with aria-activedescendant pointing at the option","On the listbox"], a:1, e:"That's what lets the user keep typing while browsing (except for dialog popups, where focus moves in)."},
    {q:"What should Escape do while the popup is open?", o:["Select the highlighted option","Close the popup and keep the current value"], a:1, e:"Escape is the safe way out of exploring suggestions."}
  ],
  recap:"A combobox is a labelled input with role=\"combobox\" wired to a popup through aria-controls, with aria-expanded tracking whether it's open. Focus stays on the input and aria-activedescendant marks the highlighted option, so scrolling must be handled by script, and Escape safely discards exploration. Editable versions declare aria-autocomplete, and the popup can be a listbox, grid, tree or dialog."
},

/* ============================== dialog (modal) */
"dialog-modal":{
  name:"Dialog (Modal)", apg:APG+"dialog-modal/", example:APG+"dialog-modal/examples/dialog/",
  kw:"dialog modal aria-modal focus trap initial focus return focus escape inert date picker",
  summary:"A window overlaid on the page; while it's open, everything underneath is inert.",
  what:"A modal dialog sits on top of the page (or another dialog). Everything underneath is inert: it can't be clicked or tabbed to, and is usually dimmed. The dialog has its own tab sequence, and focus can't leave it without closing it. In one sentence: a self-contained focus loop that blocks everything else.",
  demos:[{kind:"dialog", title:"Layered dialogs with different initial focus", note:"The address form puts focus on its first field. “Verify address” opens a second dialog whose first control is far down, so focus starts on its first paragraph (tabindex=\"-1\"). Closing each returns focus to the button that opened it. Built with the native <dialog> element and showModal()."}],
  sections:[
    {id:"initial-focus", title:"Where initial focus goes", table:{caption:"Initial focus by dialog content", head:["Situation","Put initial focus on"], rows:[["A simple form","The first focusable element, usually the first field."],["Mostly text, with the first control far down","A static element at the top (the title or first paragraph) with tabindex=\"-1\", so the start of the text and the focus are both visible."],["Confirming a destructive or hard-to-reverse action","The least destructive option, such as Cancel (see Alert and Message Dialogs)."],["A simple acknowledgement","The most likely next action, such as OK."]]}, after:"<p><b>Never focus the dialog element itself.</b> A large focused region is hard to spot, there's no good place to draw a focus ring around a bordered dialog, and screen readers read the whole dialog as one unbroken block.</p>"},
    {id:"return-focus", title:"Where focus goes on close", table:{caption:"Focus on dialog close", head:["Situation","Focus goes to"], rows:[["Normal case","The element that opened the dialog."],["The opener no longer exists","The closest control that keeps the workflow logical."],["The task leads straight into a next step","That next step. APG's example: after adding rows from a dialog, focus goes to the first new cell, not back to the “Add rows” button."]]}, after:"<p>Also recommended: always include a visible, labelled close control (Close, Cancel, or an × button with a name) in the dialog's tab sequence. Don't rely on Escape alone.</p>"},
    {id:"date-picker", title:"Date picker dialog", html:"<p>A dialog can host another widget. In the APG date picker, the dialog contains a calendar grid with roving tabindex; arrow keys move between dates and Enter or Space picks one and closes the dialog. After choosing, the trigger's name updates to “Change date, 25 December 2026”, so when focus returns there, screen reader users hear what they picked. See the Combobox page for the other date picker details.</p>"},
    {id:"alertdialog-link", title:"Relationship to Alert and Message Dialogs", html:"<p><code>role=\"alertdialog\"</code> is a special case of this pattern: the same modality, focus handling and Escape behaviour, reserved for urgent messages that need a response. See the <a href=\"#/apg/alertdialog\">Alert and Message Dialogs</a> page.</p>"}

APG_PATTERNS.alert.sections = [{
  id:"finding",
  title:"Example audit finding: form errors not announced",
  html:`<p>A real finding about this pattern, rewritten with the criteria mapped precisely.</p>
<dl class="finding">
<dt>Issue title</dt><dd>When the form is submitted with errors, nothing is announced to screen reader users</dd>
<dt>Issue description</dt><dd>When a user submits the form with validation errors, the page shows errors visually but gives no announcement or status to assistive technology. Screen reader users can't tell whether the submission was processed, failed, or needs correcting.</dd>
<dt>Expected result</dt><dd>On a failed submission, screen reader users hear that it failed and how many errors there are, and can move to each error to fix it.</dd>
<dt>SC &amp; Level</dt><dd>4.1.3 Status Messages (AA) for the missing announcement. Also 3.3.1 Error Identification (A) if the individual errors aren't identified in text or tied to their fields. Because 4.1.3 is AA, this finding isn't Level A on its own.</dd>
<dt>Recommendation</dt><dd><p>Choose <b>one</b> of these approaches, not both:</p>
<ol><li><b>Announce with a live region:</b> keep an empty <code>&lt;div role="alert"&gt;&lt;/div&gt;</code> in the page from load (role="alert" already implies aria-live="assertive" and aria-atomic="true"), and on failed submit set its text to “Your form has 2 errors. Correct them and submit again.” Use <code>role="status"</code> instead if a polite announcement is enough.</li>
<li><b>Or move focus to an error summary</b> at the top of the form (a heading with tabindex="-1" and links to each field). The focus move itself gets it announced, so it doesn't need role="alert" as well; using both makes screen readers announce twice.</li></ol>
<p>In both cases, set <code>aria-invalid="true"</code> on each invalid field and link its error text with <code>aria-describedby</code>, and test with NVDA, JAWS or VoiceOver.</p></dd>
</dl>`
}];

      ["region","<section> with an accessible name","An important section no other landmark fits","Any number; always labelled"],
      ["contentinfo","<footer>, with the same nesting rule as banner","Page-end information: copyright, privacy links","At most one"]]}, after:"<p><b>Prefer the HTML elements.</b> Each role is implied by a native element. Use <code>role=\"…\"</code> on a <code>&lt;div&gt;</code> only when the element genuinely isn't available.</p>"},
    {id:"labels", title:"Labelling landmarks of the same type", html:"<p>One main, banner or contentinfo needs no label. But when a page has two or more landmarks of the same role (two navs, two asides), give each a unique name, so the landmarks list reads “Navigation, Site” and “Navigation, Footer links” instead of two identical entries. Use <code>aria-labelledby</code> pointing at a visible heading where one exists, otherwise <code>aria-label</code>.</p><p><b>Exception:</b> if two navigation landmarks contain exactly the same links (the same menu at the top and bottom), give them the same label, because they are the same navigation.</p>"},
    {id:"form-search", title:"Form or search?", html:"<p>Use <code>search</code> only for forms that search the site or page. Any other meaningful form (contact, booking, sign-up) is a <code>form</code> landmark, which needs a name, ideally from its visible heading. Don't label every small form as a landmark; a one-field newsletter box in the footer usually isn't worth its own entry.</p>"},
    {id:"region", title:"Region, and how many landmarks", html:"<p><code>region</code> is the catch-all for content important enough that users will want to jump to it. An unlabelled <code>&lt;section&gt;</code> creates no landmark at all. Don't reach for region by default: a landmarks list full of vague regions is no more useful than none.</p><p>A common rule of thumb is to keep a page to about seven landmarks or fewer, because the overview loses value as the list grows. Equally important: <b>every piece of content should sit inside some landmark</b>, or landmark navigation can't reach it.</p>"}
  ],
  keyboard:[["None","Landmarks have no keyboard behaviour of their own. Screen readers supply landmark navigation commands."]],
  roles:[
    ["Landmark element","role=\"banner\" / \"navigation\" / \"main\" / \"search\" / \"form\" / \"complementary\" / \"region\" / \"contentinfo\"","Only when the matching HTML element isn't used."],
    ["Any landmark","aria-labelledby","Preferred when a visible heading exists."],
    ["Any landmark","aria-label","When there's no suitable visible heading."]
  ],
  code:[{label:"Page skeleton (header = banner, section and form with names = region and form, aside = complementary, footer = contentinfo)", code:String.raw`<body>
  <header>
    <a href="/">Riverstone Library</a>
    <search aria-label="Site"><form>...</form></search>
  </header>
  <nav aria-label="Main">...</nav>
  <main>
    <h1>New arrivals</h1>
    <section aria-labelledby="picks-h">
      <h2 id="picks-h">Staff picks</h2> ...
    </section>
    <form aria-labelledby="room-h">
      <h2 id="room-h">Reserve a study room</h2> ...
    </form>
  </main>
  <aside aria-labelledby="hours-h">
    <h2 id="hours-h">Opening hours</h2> ...
  </aside>
  <footer>...</footer>
</body>`}],
  mistakes:[
    ["Missing main, or more than one","Users can't jump to the primary content, or can't tell which is primary."],
    ["Several landmarks of one type with no labels","Two identical “Navigation” entries in the landmarks list."],
    ["Nested <header> or <footer> audited as banner or contentinfo","Inside article, aside, main, nav or section they are not page-level landmarks."],
    ["Content outside every landmark","Stray text or controls directly in <body> can't be reached by landmark navigation."],
    ["Landmark soup","Every small box wrapped in a labelled region buries the useful entries."],
    ["form landmark for a search","Use search (or <search>) for search forms."],
    ["Unlabelled <section> expected to be a region","No name, no landmark."]
  ],
  good:"Native <header>, <nav>, <main>, <search>, <aside>, <footer> (and named <form> or <section> where they earn it), with unique labels for repeated types, a single main, a short landmarks list, and all content inside a landmark.",
  wcag:[["1.3.1","Page regions are programmatically determinable, not only visual."],["2.4.1","Landmarks, especially main and navigation, are one way to bypass repeated blocks."],["4.1.2","Landmarks have the right role and, where repeated, a name."],["2.4.6","Landmark labels describe the section's purpose."]],
  quiz:[
    {q:"When does a <header> become the banner landmark?", o:["Always","Only when it isn't inside article, aside, main, nav or section"], a:1, e:"A header inside a card or section is just a header."},
    {q:"Does an unlabelled <section> create a region landmark?", o:["Yes","No"], a:1, e:"A region landmark always needs an accessible name."},
    {q:"Two navs contain exactly the same links. How should they be labelled?", o:["With different labels","With the same label"], a:1, e:"The same label tells users they're the same navigation."}
  ],
  recap:"Landmarks are eight roles (banner, navigation, main, search, form, complementary, region, contentinfo), best created with native HTML elements. They have no keyboard behaviour; screen readers provide the navigation. Label repeated types uniquely (except identical repeated navs), always label regions, keep the list short, and make sure all content sits inside a landmark."
},

/* ============================== link */
link:{
  name:"Link", apg:APG+"link/", example:APG+"link/examples/link/",
  kw:"link role link anchor href span img aria-label enter context menu",
  summary:"An interactive reference to a resource. The link role is a fallback for when a non-<a> element has to act as a link.",
  what:"A link takes the user somewhere. role=\"link\" exists so that, when a <span> or <img> is used to create link behaviour, assistive technology still announces it as a link. APG opens this pattern with a warning: role=\"link\" gives none of a browser's built-in link behaviour. Everything has to be rebuilt in script, and much of it can't be.",
  demos:[{kind:"link", title:"Three role=\"link\" variants", note:"None of these is a real anchor, so both the click and the Enter handlers had to be written by hand. For this demo they log where they would go instead of leaving the page. Try right-clicking one: there's no “Open in new tab”."}],
  sections:[
    {id:"why-a", title:"Why a real <a href> is better", table:{caption:"Native link vs role=link", head:["A native <a href> gives you","With role=\"link\" on something else"], rows:[
      ["Click navigates to the target","Must be scripted"],["Enter activates it","Must be scripted with a keydown handler"],["Context menu: open in new tab, copy link","Not available; there's no real URL"],["Middle-click or Ctrl+click opens a new tab","Not available unless rebuilt"],["URL preview in the status bar","Not available"],["Visited-link styling","Not available"],["Works without JavaScript","Doesn't work at all"]]}, after:"<p>This pattern is for genuinely constrained cases, not an alternative to anchors. If it doesn't go anywhere and just does something on the page, it should be a button.</p>"},
    {id:"naming", title:"Accessible name for each variant", table:{caption:"Where each variant's name comes from", head:["Variant","Element","Name comes from"], rows:[["Text content","<span>","Its visible text"],["Image","<img>","The alt attribute"],["CSS-generated text","Empty <span> with ::before content","aria-label, because generated content isn't reliably included in the accessible name"]]}}
  ],
  keyboard:[["Enter","Activates the link and navigates to its target."],["Shift + F10 (optional)","Opens a context menu for the link, if one has been built."]],
  kbNote:"Shift+F10 is optional because there's no native menu to fall back on; most implementations skip it and accept fewer features than a real link.",
  roles:[
    ["Non-<a> element acting as a link","role=\"link\"","Announced as a link."],
    ["The same element","tabindex=\"0\"","Spans and images aren't focusable by default."],
    ["<img>","alt","Supplies the name."],
    ["<span> with no reliable text","aria-label","Supplies the name."]
  ],
  code:[{label:"role=\"link\" (and the better alternative)", code:String.raw`<span role="link" tabindex="0" data-href="https://www.w3.org/">W3C website</span>

el.addEventListener('click', go);
el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
function go() { location.href = el.dataset.href; }

/* Better: all of the above, plus everything a real link does */
<a href="https://www.w3.org/">W3C website</a>`}],
  mistakes:[
    ["role=\"link\" where <a href> would work","Loses every native link feature for no benefit."],
    ["No tabindex=\"0\"","Keyboard users can't reach it."],
    ["Click handler without an Enter handler, or the reverse","Both activation paths must be built by hand."],
    ["CSS-generated label with no aria-label","The name varies between browsers and screen readers."],
    ["role=\"link\" on something that doesn't navigate","If it performs an action, it's a button."],
    ["No visible focus style","Custom elements don't get one for free."]
  ],
  good:"A native <a href> with descriptive text. If role=\"link\" truly can't be avoided: tabindex=\"0\", a reliable name, Enter and click both handled, and a visible focus style.",
  wcag:[["2.1.1","Enter activates the link, as with a native anchor."],["4.1.2","The link role and a reliable accessible name."],["2.4.7","A visible focus indicator on the custom element."],["2.4.4","The name, with its context, makes the purpose clear."]],
  quiz:[
    {q:"Does role=\"link\" give an element native link behaviour such as “Open in new tab”?", o:["Yes","No"], a:1, e:"It only changes how the element is announced; behaviour must be scripted, and some can't be rebuilt."},
    {q:"Why does the CSS-generated variant need aria-label?", o:["Generated content isn't reliably part of the accessible name","aria-label makes it focusable"], a:0, e:"Browsers differ in whether ::before content is included."}
  ],
  recap:"role=\"link\" with tabindex=\"0\" makes a span or image announce as a link, but it's a fallback: a native <a href> brings navigation, keyboard activation, context menus, new-tab shortcuts and more for free. Name it from text, alt, or aria-label, and handle both click and Enter."
},

/* ============================== listbox */
listbox:{
  name:"Listbox", apg:APG+"listbox/", example:APG+"listbox/examples/listbox-scrollable/",
  kw:"listbox option select multi-select aria-selected aria-multiselectable aria-activedescendant typeahead optgroup group",
  summary:"A list of options from which the user selects one or more.",
  what:"A listbox lets users pick one option (single-select) or several (multi-select). It's the widget equivalent of <select>: the scrollable example behaves like <select size=\"5\">, and grouped options mirror <optgroup>. Prefer the native element when it can meet the design; a custom listbox brings real build and maintenance cost.",
  callout:{title:"What a listbox is not for", text:"An option's accessible name is one flat string, and the listbox model can't reach anything inside an option. Headings inside options lose their meaning, and links, buttons or checkboxes inside options can't be used. A list whose rows contain their own controls is a Grid, not a listbox."},
  demos:[
    {kind:"listbox-single", title:"Scrollable single-select listbox", note:"Tab in, then use Up and Down, Home and End, or type a letter (try “m” several times). Selection follows focus. Focus stays on the list itself; aria-activedescendant points at the highlighted option, which script scrolls into view."},
    {kind:"listbox-multi", title:"Grouped multi-select listbox", note:"Space toggles the focused option, Shift+Down or Shift+Up moves and toggles, Ctrl+A selects all. Plain arrow keys move without changing the selection, which is the model APG recommends."}
  ],
  sections:[
    {id:"naming", title:"Naming options well", html:"<p>Screen readers read an option's whole name as one chunk. Keep names short, and avoid many options that start with the same words: in a city picker where every option starts with the country name, users hear the country again and again. Two listboxes (country, then city) work better.</p>"},
    {id:"multi", title:"Multi-select keyboard models", table:{caption:"Recommended multi-select keys", head:["Key","Function"], rows:[["Space","Toggles the focused option."],["Shift + Down / Up","Moves focus and toggles the newly focused option."],["Shift + Space (optional)","Selects from the most recently selected option to the focused one."],["Ctrl + Shift + Home / End (optional)","Selects from the focused option to the first or last."],["Ctrl + A (optional)","Selects all (and may deselect all if everything is selected)."]]}, after:"<p>This model doesn't need a held modifier just to move without losing a selection, which is easier than native <code>&lt;select multiple&gt;</code>. The alternative model (Ctrl+arrow to move, Ctrl+Space to toggle) is also valid. Pick one and use it consistently across the product.</p>"},
    {id:"rearrange", title:"Rearrangeable listboxes", table:{caption:"Rearrangeable listbox details", head:["Feature","Detail"], rows:[["Shortcuts on action buttons","For example Alt+Up/Down to move, Enter to add, Delete to remove, advertised with aria-keyshortcuts."],["Context-scoped shortcuts","Enter only adds when focus is in the “available” list; Delete only removes in the “chosen” list."],["Focus after an action","Stays on the moved option in its new place, so several moves can be made in a row."],["Toolbar","Several action buttons grouped in a toolbar, so they're one tab stop."],["Live region","Announces “Moved to Unimportant features”, because the move is otherwise silent."]]}},
    {id:"selected-checked", title:"aria-selected or aria-checked", html:"<p>Either can show selection, but not both in one listbox. A common convention is aria-selected for single-select and aria-checked for multi-select; APG treats that as a recommendation, not a rule. Whatever you choose, be consistent across the product.</p>"}
  ],
  keyboard:[["Down / Up Arrow","Moves focus to the next or previous option; in single-select it may also select it."],["Home / End (recommended for more than 5 options)","First or last option."],["Type-ahead (recommended for more than 7 options)","Typing characters quickly moves to the next option starting with them."],["Space (multi-select)","Toggles the focused option."]],
  roles:[
    ["Container","role=\"listbox\"","The focusable element that holds the options."],
    ["Container","aria-labelledby or aria-label","Required name (unless it's part of a combobox)."],
    ["Container","tabindex=\"0\"","The listbox is one tab stop; options aren't."],
    ["Container","aria-activedescendant","The id of the highlighted option."],
    ["Container","aria-multiselectable=\"true\"","Only on multi-select listboxes."],
    ["Container","aria-orientation=\"horizontal\"","Only when options are laid out horizontally."],
    ["Each item","role=\"option\"","A selectable option."],
    ["Each option","aria-selected or aria-checked","Selection state; one convention per listbox."],
    ["Option group","role=\"group\" with aria-labelledby or aria-label","Groups related options; each group needs a name."],
    ["Each option (if not all loaded)","aria-setsize and aria-posinset","When the full set isn't in the DOM."]
  ],
  code:[{label:"Single-select listbox", code:String.raw`<span id="el-label">Choose your favourite transuranic element</span>
<ul role="listbox" tabindex="0" aria-labelledby="el-label"
    aria-activedescendant="el-np">
  <li role="option" id="el-np" aria-selected="true">Neptunium</li>
  <li role="option" id="el-pu" aria-selected="false">Plutonium</li>
</ul>

function focusOption(opt) {
  listbox.setAttribute('aria-activedescendant', opt.id);
  opt.scrollIntoView({ block: 'nearest' });   // not automatic
}`}],
  mistakes:[
    ["Interactive controls inside options","The listbox model can't reach them; use a grid."],
    ["No name on the listbox or on option groups","Every listbox and group needs a label."],
    ["aria-selected and aria-checked mixed","Ambiguous about which means selected."],
    ["Active option not scrolled into view","aria-activedescendant doesn't scroll by itself."],
    ["Undocumented modifier-key model","Users can't discover that Ctrl is needed to keep a selection."],
    ["No announcement after moving options","Rearrangeable lists need a live region."],
    ["Long or repetitive option names","Hard to follow by ear."]
  ],
  good:"A named listbox with short, distinct option names, aria-activedescendant kept in sync and scrolled into view, one consistent selection attribute, labelled groups, and no controls inside options.",
  wcag:[["2.1.1","Navigation and selection work by keyboard."],["4.1.2","Listbox, options and groups have roles, names and current selection state."],["2.4.7","The highlighted option is clearly visible, since real focus stays on the container."],["4.1.3","Move and reorder confirmations are announced without moving focus."]],
  quiz:[
    {q:"A list needs a link and a delete button in each row. Listbox or grid?", o:["Listbox","Grid"], a:1, e:"Listbox options can't contain usable interactive elements."},
    {q:"In the recommended multi-select model, what does a plain Down Arrow do?", o:["Moves focus without changing selection","Selects the next option and deselects others"], a:0, e:"Space and Shift+arrows change selection; plain arrows only move."}
  ],
  recap:"A listbox is a named, single-tab-stop list of options for single or multiple selection, usually managed with aria-activedescendant (so scroll the active option into view). Keep options short and free of controls, name every group, and use aria-selected or aria-checked consistently."
},

/* ============================== menu button */
"menu-button":{
  name:"Menu Button", apg:APG+"menu-button/", example:APG+"menu-button/examples/menu-button-actions/",
  kw:"menu button aria-haspopup aria-expanded menu menuitem actions dropdown activedescendant focus",
  summary:"A button that opens a menu.",
  what:"A menu button is a button that opens a menu, usually shown with a small down arrow so users know it reveals choices rather than acting directly. It's two patterns together: the trigger is a button with a couple of extra attributes, and the menu it opens follows the Menu and Menubar pattern.",
  demos:[
    {kind:"menubtn-focus", title:"Actions menu using element.focus()", note:"Each menu item receives real DOM focus as you arrow through."},
    {kind:"menubtn-ad", title:"Actions menu using aria-activedescendant", note:"The same behaviour, but DOM focus stays on the menu container and aria-activedescendant points at the highlighted item."},
    {kind:"menubtn-links", title:"Navigation menu button with real links", note:"The items are real <a href> elements with role=\"menuitem\", so native link features still work. For this demo, choosing one just reports it."}
  ],
  sections:[
    {id:"techniques", title:"Two ways to manage focus in the menu", table:{caption:"element.focus() vs aria-activedescendant", head:["","element.focus()","aria-activedescendant"], rows:[
      ["Where DOM focus goes","Onto each menu item","Stays on the menu container"],
      ["How the active item is tracked","document.activeElement","aria-activedescendant on the container"],
      ["tabindex on items","tabindex=\"-1\" on each item","None"],
      ["tabindex on the container","None","tabindex=\"-1\", focused once when the menu opens"],
      ["What assistive tech follows","Normal focus events per item","Changes to aria-activedescendant"]]}, after:"<p>Both are valid. What matters is that one technique is applied correctly and consistently, not a mix of both in one widget.</p>"},
    {id:"links", title:"Menus of links", html:"<p>For a menu of links, put <code>role=\"menuitem\"</code> on the <code>&lt;a&gt;</code> itself, and <code>role=\"none\"</code> on the wrapping <code>&lt;li&gt;</code>. Accessibility APIs hide the children of a menu item, so if the role were on the <code>&lt;li&gt;</code>, the link inside it would lose its semantics.</p><p>Remember, though: ordinary site navigation usually shouldn't be a menu at all. See <a href=\"#/apg/disclosure\">Disclosure</a>.</p>"}
  ],
  keyboardTables:[
    {title:"On the button", rows:[["Enter or Space","Opens the menu and focuses the first item."],["Down Arrow (optional)","Opens the menu and focuses the first item."],["Up Arrow (optional)","Opens the menu and focuses the last item."]]},
    {title:"In the open menu", rows:[["Down / Up Arrow","Next or previous item, wrapping at the ends."],["Home / End","First or last item."],["A letter","Next item starting with that letter."],["Enter or Space","Activates the item, closes the menu, returns focus to the button."],["Escape","Closes the menu and returns focus to the button."],["Tab","Closes the menu and moves on in the page."]]}
  ],
  roles:[
    ["Trigger","<button> (or role=\"button\")","The button."],
    ["Button","aria-haspopup=\"menu\" (or \"true\")","Says it opens a menu. There's no separate “menu button” role; platforms infer it from this."],
    ["Button","aria-expanded=\"true\" / \"false\"","Whether the menu is open."],
    ["Button (optional)","aria-controls","Points at the menu."],
    ["Menu","role=\"menu\"","Holds the items."],
    ["Menu","aria-labelledby=\"button-id\"","Usually named by the button."],
    ["Each item","role=\"menuitem\" (on the <a> for link menus)","A choice."],
    ["Items or container","tabindex=\"-1\"","Focusable by script, not in the tab order (items for element.focus(), container for aria-activedescendant)."],
    ["Menu (activedescendant technique)","aria-activedescendant","The highlighted item's id."],
    ["<li> around a link item","role=\"none\"","Removes the list item role."]
  ],
  code:[{label:"Actions menu button", code:String.raw`<button type="button" id="act-btn" aria-haspopup="menu"
        aria-expanded="false" aria-controls="act-menu">Actions</button>
<ul role="menu" id="act-menu" aria-labelledby="act-btn" hidden>
  <li role="menuitem" tabindex="-1">Action 1</li>
  <li role="menuitem" tabindex="-1">Action 2</li>
</ul>

btn.addEventListener('click', () => {
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  menu.querySelector('[role="menuitem"]').focus();   // move focus in
});`}],
  mistakes:[
    ["aria-expanded missing or stuck","Users can't tell whether the menu is open."],
    ["Menu opens but focus stays on the button","Focus must move to the first (or last) item."],
    ["Escape doesn't return focus to the button","Focus is lost when the menu disappears."],
    ["Both focus techniques mixed","tabindex=\"-1\" items plus aria-activedescendant gives two sources of truth."],
    ["role=\"menuitem\" on the <li> in a link menu","The link inside loses its semantics."],
    ["No visual sign it opens a menu (best practice)","Add the down-arrow convention."],
    ["A menu used for site navigation","Use disclosure buttons instead."]
  ],
  good:"A <button> with aria-haspopup and aria-expanded, a named menu, focus moved into it on open, Escape and activation returning focus to the button, and one focus technique used consistently.",
  wcag:[["2.1.1","Opening, moving, choosing and closing work by keyboard."],["4.1.2","aria-haspopup and aria-expanded on the button; menu and menuitem roles on the menu."],["2.4.7","The active item is clearly visible with either technique."],["2.4.3","Focus moves into the menu on open and back to the button on close."],["2.1.2","Escape always closes the menu."]],
  quiz:[
    {q:"Which attributes turn a button into a menu button?", o:["role=\"menubutton\"","aria-haspopup=\"menu\" and aria-expanded"], a:1, e:"There's no menubutton role."},
    {q:"In a link menu, where does role=\"menuitem\" go?", o:["On the <li>","On the <a>"], a:1, e:"A menu item's children are hidden, so the link itself must be the menu item."}
  ],
  recap:"A menu button is a button with aria-haspopup and aria-expanded that opens a menu following the Menu and Menubar pattern. Move focus into the menu on open, return it to the button on Escape or activation, and manage focus with either element.focus() or aria-activedescendant, consistently. In link menus, the <a> carries role=\"menuitem\"."
},

/* ============================== menu and menubar */
menubar:{
  name:"Menu and Menubar", apg:APG+"menubar/", example:APG+"menubar/examples/menubar-editor/",
  kw:"menu menubar menuitem menuitemcheckbox menuitemradio submenu separator application menu roving tabindex",
  summary:"Application-style menus: a persistent menubar of commands, and menus that pop up from it or from menu buttons.",
  what:"A menu offers a list of actions or functions, like desktop application menus. A menubar is a persistent, usually horizontal menu at the top of an interface (File, Edit, View). Menus can also open from a menu button, from a parent item's submenu, or from a context command like Shift+F10. Items that open a dialog conventionally end with an ellipsis, such as “Save as…”.",
  callout:{title:"Not for ordinary site navigation", text:"APG's own navigation menubar example warns that this pattern needs complex behaviour that typical site navigation doesn't. For links grouped into fly-outs, use the Disclosure pattern. Use menu roles only for real application menus of commands and options."},
  demos:[{kind:"menubar", title:"Text-formatting menubar", note:"Tab into the menubar, use Left and Right between Font, Style and Size, Down or Enter to open a menu, Up and Down inside it, Escape to close. Bold and Italic are checkboxes, fonts and colours are radios, and Smaller or Larger become disabled (but stay focusable) at the size limits."}],
  sections:[
    {id:"composite", title:"A composite widget", html:"<p>Tab moves into and out of the whole menubar as one stop; arrow keys move between items. The menubar is persistent, so it keeps a roving tabindex and remembers the last item. A menu is not persistent, so when it opens, script must move focus to its first item.</p>"},
    {id:"items", title:"The three item types", table:{caption:"Menu item types", head:["Role","Behaves like","State"], rows:[["menuitem","A command; activating it does something and closes the menu (unless it opens a submenu)","None, or aria-disabled"],["menuitemcheckbox","An independent on/off option, such as Bold","aria-checked=\"true\" / \"false\""],["menuitemradio","One choice from a set, such as a font","aria-checked=\"true\" on the chosen one; choosing another unchecks it"]]}, after:"<p>If every item in a menu is part of one radio set, the menu defines the group. Use <code>role=\"group\"</code> (with a name) only to delimit a radio set within a mixed menu. Separators are never focusable. Disabled items stay focusable so users can discover them, but can't be activated.</p>"}
  ],
  keyboardTables:[
    {title:"In the menubar", rows:[["Tab / Shift + Tab","Moves into or out of the menubar, closing any open menu."],["Right / Left Arrow","Next or previous item, wrapping."],["Down Arrow, Enter or Space","Opens the item's menu and focuses its first item."],["Up Arrow (optional)","Opens the menu and focuses its last item."],["Home / End","First or last item."],["A letter","Next item starting with that letter."]]},
    {title:"In a menu", rows:[["Down / Up Arrow","Next or previous item, wrapping."],["Enter","Opens a submenu, or activates the item and closes all menus."],["Space","Toggles a checkbox or radio item (menus may stay open); otherwise as Enter."],["Right Arrow","Opens a submenu; in a menu opened from the menubar, moves to the next menubar item and opens its menu."],["Left Arrow","Closes a submenu; in a menu opened from the menubar, moves to the previous menubar item and opens its menu."],["Home / End","First or last item."],["A letter","Next item starting with that letter."],["Escape","Closes the menu and returns focus to its parent item."]]}
  ],
  roles:[
    ["Top-level container","role=\"menubar\"","A persistent menu."],
    ["Popup container","role=\"menu\"","A non-persistent menu."],
    ["menubar or menu","aria-label or aria-labelledby","Every menu container needs a name."],
    ["Command item","role=\"menuitem\"","Performs an action or opens a submenu."],
    ["Toggle item","role=\"menuitemcheckbox\"","With aria-checked."],
    ["Choice item","role=\"menuitemradio\"","Only one checked per group."],
    ["Parent item","aria-haspopup=\"menu\" and aria-expanded","Has a submenu, and whether it's open."],
    ["Any item","aria-disabled=\"true\"","Focusable but not activatable."],
    ["Divider","role=\"separator\"","Not focusable."],
    ["Radio subset","role=\"group\" with a name","Only in mixed menus."],
    ["Items","Roving tabindex or aria-activedescendant","Pick one technique."]
  ],
  code:[{label:"Menubar structure", code:String.raw`<ul role="menubar" aria-label="Text formatting">
  <li role="none">

/* ============================== switch */
switch:{
  name:"Switch", apg:APG+"switch/", example:APG+"switch/examples/switch/",
  kw:"switch toggle on off aria-checked role switch settings",
  summary:"An input that lets the user choose between exactly two values: on or off.",
  what:"A switch looks and behaves like a light switch or a phone settings toggle. The one semantic difference from a checkbox or toggle button: <b>no middle state</b>. Checkboxes can be mixed and toggle buttons can be partly pressed; a switch is strictly on or off. If a mixed state might ever be needed, it isn't a switch.".replace("<b>","").replace("</b>",""),
  callout:{title:"The label must not change", text:"APG stresses this: a switch labelled “Notifications” stays “Notifications” whether on or off. Never relabel it “Turn notifications off”. aria-checked (or the native checked property) carries the state. That's why APG's examples hide their visible “On”/“Off” text with aria-hidden=\"true\": it's a visual cue, not part of the name."},
  demos:[
    {kind:"switch-div", title:"Div-based switch", note:"A <div role=\"switch\"> with visible On/Off text hidden from assistive tech. Tab to it and press Space or Enter."},
    {kind:"switch-button", title:"Button-based switches in a group", note:"Each is a real <button role=\"switch\">, so Space, Enter and focus come for free; the heading labels the group."},
    {kind:"switch-checkbox", title:"Checkbox-based switches in a fieldset", note:"Each is <input type=\"checkbox\" role=\"switch\">. The native checked state is used; no aria-checked."}
  ],
  sections:[
    {id:"which", title:"Switch, checkbox or toggle button?", table:{caption:"Choosing semantics", head:["Scenario","Better semantics","Why"], rows:[["A standalone control that turns lights on or off","switch","“Lights, switch, on” matches how people think about it."],["An item in a list titled “Which of these must be in your pre-takeoff checks?”","checkbox","“Lights, checkbox, checked” fits a checklist."]]}, after:"<p>There's no universal answer: the same on/off function can call for different semantics depending on the context. Judge the choice against how the control is presented and worded.</p>"}
  ],
  keyboard:[["Space","Toggles on and off."],["Enter (optional)","Also toggles, where supported."]],
  roles:[
    ["Switch","role=\"switch\" (on a div, button, or checkbox input)","Identifies an on/off control."],
    ["Non-native switch","aria-checked=\"true\" / \"false\"","The state. Not used on <input type=\"checkbox\">, which exposes checked natively."],
    ["Switch","Text content, aria-labelledby or aria-label","The name, which never changes with state."],
    ["Group of switches","role=\"group\" with aria-labelledby, or <fieldset> and <legend>","Labels the set."],
    ["Switch or group (optional)","aria-describedby","Extra description."],
    ["Visible On/Off text","aria-hidden=\"true\"","Keeps it out of the name."]
  ],
  code:[{label:"Button switch", code:String.raw`<button type="button" role="switch" aria-checked="false" id="lights">
  <span class="label">Living room lights</span>
  <span class="track" aria-hidden="true"></span>
  <span class="state" aria-hidden="true">Off</span>
</button>

lights.addEventListener('click', () => {
  const on = lights.getAttribute('aria-checked') === 'true';
  lights.setAttribute('aria-checked', String(!on));
  lights.querySelector('.state').textContent = on ? 'Off' : 'On';   // name unchanged
});`}],
  mistakes:[
    ["Label changes with state","Directly contradicts APG; state belongs in aria-checked."],
    ["Visible On/Off text not hidden","It leaks into the name and duplicates the state."],
    ["Switch used where a mixed state is needed","Use a checkbox or toggle button."],
    ["No group label for a set of switches","Users don't know they form one group."],
    ["aria-checked on a native checkbox switch","Redundant with the native checked state."],
    ["State shown only by track colour","Pair colour with text, position or shape."]
  ],
  good:"A <button role=\"switch\"> or <input type=\"checkbox\" role=\"switch\"> with a constant label, aria-checked (or native checked) kept in sync, On/Off text hidden from assistive tech, and a labelled group for related switches.",
  wcag:[["4.1.2","Switch role, a stable name and accurate on/off state."],["2.1.1","Space (and optionally Enter) toggles it."],["1.4.1","On and off aren't shown by colour alone."],["1.4.11","The track and knob have 3:1 contrast in both states."],["1.3.1","Related switches are grouped under a label."]],
  quiz:[
    {q:"Can a switch have a mixed state?", o:["Yes","No"], a:1, e:"That's the one semantic difference from a checkbox."},
    {q:"The switch is on. Should its label become “Turn off notifications”?", o:["Yes","No; keep “Notifications”"], a:1, e:"aria-checked conveys the state; the label stays the same."}
  ],
  recap:"A switch is a strictly on/off control with role=\"switch\". Keep its label constant, carry state in aria-checked (or native checked on a checkbox input), hide visible On/Off text from assistive tech, and group related switches under a label. Build it on a native button or checkbox when you can."
},

  sections:[

    ["Sort icons that differ only in colour","Shapes must differ."],
    ["Hand-built ARIA table with no name","Nothing to announce what it contains."],
    ["role=\"table\" untested with real assistive tech","Support has been more variable than most roles."],

/* ============================== tabs */
tabs:{

  kw:"tabs tablist tab tabpanel aria-selected roving tabindex automatic manual activation",
  summary:"Layered sections of content, called tab panels, shown one at a time with a set of tabs.",

  sections:[
    {id:"roving", title:"Roving tabindex", html:"<p>The tab list is <b>one tab stop</b>. Only the active tab has tabindex=\"0\" (or no tabindex on a button); the others have tabindex=\"-1\". Tab enters the list on the active tab, Tab again leaves it, and arrow keys move between tabs. Without roving tabindex, keyboard users must Tab through every tab to get past the widget.</p>"},
    {id:"activation", title:"Automatic or manual activation", table:{caption:"Automatic vs manual activation", head:["","Automatic","Manual"], rows:[["Arrow keys","Move focus and activate","Move focus only"],["To activate","Just arrow to it","Arrow to it, then Enter or Space"],["Best when","All panels are in the DOM and switch instantly","Panels load on demand, are slow to render, or activation has side effects"],["Risk if misused","Laggy arrowing through slow panels","One extra key press per switch"]]}, after:"<p>APG: use automatic activation only when panels display with no noticeable delay. Manual activation is a legitimate choice, not a missing feature. Flag automatic activation with slow panels, or a mix of both models in one widget.</p>"}
  ],
  keyboard:[["Tab","Enters the tab list on the active tab; from the list, moves into the panel or on."],["Right / Left Arrow","Next or previous tab, wrapping (automatic: also activates)."],["Enter / Space (manual)","Activates the focused tab."],["Home / End (optional)","First or last tab (automatic: also activates)."],["Down / Up Arrow (vertical tab lists only)","With aria-orientation=\"vertical\", act like Right and Left. Horizontal lists leave them for page scrolling."],["Delete (optional)","In closable tab sets, closes the tab and moves focus to the next one."]],
  roles:[

    ["Tab list","aria-labelledby or aria-label","Says what the tabs choose between."],

<div role="tabpanel" id="p1" aria-labelledby="t1" tabindex="0">...</div>
<div role="tabpanel" id="p2" aria-labelledby="t2" tabindex="0" hidden>...</div>`}],

    ["Tab list with no name","“Tab list, 4 items” with no context."],

/* ============================== toolbar */
toolbar:{
  name:"Toolbar", apg:APG+"toolbar/", example:APG+"toolbar/examples/toolbar/",
  kw:"toolbar roving tabindex buttons toggle aria-pressed aria-disabled editor formatting",
  summary:"A container that groups a set of controls, such as buttons, toggle buttons or menu buttons, into one tab stop.",
  what:"A toolbar groups controls (buttons, toggle buttons, menu buttons, even small widgets like a radio group or spinbutton) into a single tab stop. Instead of pressing Tab a dozen times across an editor's buttons, users Tab in once, move with arrow keys, and Tab out once. role=\"toolbar\" changes only how focus moves; each control keeps its own role.",
  callout:{title:"Three or more controls", text:"APG: use a toolbar only for three or more controls. For one or two, it adds overhead with no navigation benefit."},
  demos:[{kind:"toolbar", title:"Text editor toolbar", note:"One tab stop for the whole toolbar; Left and Right move between controls (wrapping), Home and End jump to the ends, and returning to the toolbar lands on the last control you used. The alignment radios check only with Space or Enter. Paste starts aria-disabled but stays focusable; copying text enables it. The font size spinbutton uses Up and Down. Hover or focus the formatting buttons to see their labels; Escape dismisses a label."}],
  sections:[
    {id:"arrow-clash", title:"When a control needs arrow keys too", html:"<p>A slider, spinbutton or radio group may want arrow keys for itself. APG's advice: avoid that where possible; otherwise let the control use only the direction the toolbar doesn't (a spinbutton in a horizontal toolbar can use Up and Down), and place it last to reduce collisions.</p><p>A radio group nested in a toolbar gives up selection-follows-focus: Left and Right move through the radios and out at the edges without changing the selection, and Space or Enter checks the focused radio. See <a href=\"#/apg/radio\">Radio Group</a>.</p>"},
    {id:"disabled", title:"Disabled controls stay focusable", html:"<p>For controls that are only temporarily unavailable (Paste with an empty clipboard, Cut with no selection), use <code>aria-disabled=\"true\"</code> rather than the <code>disabled</code> attribute, and make activation do nothing. Users can still arrow onto “Paste, unavailable” instead of the control silently vanishing from the sequence.</p>"},
    {id:"labels", title:"Popup labels on hover and focus", table:{caption:"1.4.13 requirements for popup labels", head:["Requirement","In a toolbar"], rows:[["Dismissible","Escape hides the label without moving focus or the pointer."],["Hoverable","The pointer can move onto the label without it disappearing."],["Persistent","It stays until hover or focus moves away or it's dismissed; no timer."]]}, after:"<p>Icon buttons still need an accessible name (aria-label or hidden text); the popup label is for sighted users.</p>"}
  ],
  keyboard:[["Tab","Enters the toolbar on the last-used (or first) control."],["Shift + Tab","Leaves the toolbar."],["Right / Left Arrow","Next or previous control (horizontal); optionally wraps."],["Down / Up Arrow","Next or previous control in a vertical toolbar (aria-orientation=\"vertical\")."],["Home / End (optional)","First or last control."]],
  roles:[
    ["Container","role=\"toolbar\"","Groups the controls into one tab stop. Not a landmark."],
    ["Toolbar","aria-label or aria-labelledby","Names it (“Text formatting”)."],
    ["Toolbar","aria-orientation=\"vertical\"","Only for vertical toolbars."],
    ["Toggle buttons","aria-pressed","Bold, Italic, Underline."],
    ["Nested radio group","role=\"radiogroup\" with role=\"radio\" items","One slot in the toolbar sequence."],
    ["Temporarily unavailable controls","aria-disabled=\"true\"","Stay focusable."],
    ["Menu button","aria-haspopup and aria-expanded","As in the Menu Button pattern."],
    ["Spinbutton","role=\"spinbutton\" with value attributes","As in the Spinbutton pattern."],
    ["All top-level controls","One tabindex=\"0\", the rest tabindex=\"-1\"","Roving tabindex."]
  ],
  code:[{label:"Roving tabindex in a toolbar", code:String.raw`<div role="toolbar" aria-label="Text formatting">
  <button type="button" aria-pressed="false" aria-label="Bold" tabindex="0">B</button>
  <button type="button" aria-pressed="false" aria-label="Italic" tabindex="-1">I</button>
  <button type="button" aria-disabled="true" tabindex="-1">Paste</button>
</div>

toolbar.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const items = [...toolbar.querySelectorAll('button')];
  let i = items.indexOf(document.activeElement) + (e.key === 'ArrowRight' ? 1 : -1);
  i = (i + items.length) % items.length;
  items.forEach(b => b.tabIndex = -1);
  items[i].tabIndex = 0;
  items[i].focus();
});`}],
  mistakes:[
    ["Every control is its own tab stop","It's just a row of buttons, not a toolbar."],
    ["disabled instead of aria-disabled","Unavailable controls vanish from the sequence."],
    ["Nested radio group fights the toolbar's arrows","Users get stuck, or selection changes as they pass through."],
    ["role=\"toolbar\" on one or two controls","No benefit."],
    ["Popup labels that time out or vanish when hovered","Fails 1.4.13."],
    ["Icon buttons with no accessible name","The popup label isn't a name."]
  ],
  good:"A named toolbar of three or more controls with one tab stop, arrow-key movement that remembers the last control, aria-disabled for temporarily unavailable controls, and nested widgets that don't fight over arrow keys.",
  wcag:[["2.1.1","Every control works with Tab, arrows and Enter or Space."],["2.4.3","Arrow-key order follows the visual order."],["4.1.2","Controls expose roles and states (pressed, checked, disabled, value)."],["1.4.13","Hover and focus labels are dismissible, hoverable and persistent."],["2.4.7","The focused control is always visible."]],
  quiz:[
    {q:"Paste is unavailable. disabled or aria-disabled?", o:["disabled","aria-disabled=\"true\""], a:1, e:"It stays discoverable in the toolbar."},
    {q:"Is role=\"toolbar\" a landmark?", o:["Yes","No"], a:1, e:"It groups controls into one tab stop; it doesn't appear in the landmarks list."}
  ],
  recap:"A toolbar groups three or more controls into one tab stop with roving tabindex and arrow keys. Keep temporarily unavailable controls focusable with aria-disabled, stop nested widgets fighting over arrow keys, name icon buttons, and make any hover labels meet 1.4.13."
},

/* ============================== treegrid */
treegrid:{
  name:"Treegrid", apg:APG+"treegrid/", example:APG+"treegrid/examples/treegrid-1/",
  kw:"treegrid tree grid rows cells expand collapse aria-expanded aria-level email inbox",
  summary:"A hierarchical data grid whose rows can be expanded and collapsed, like a tree, and navigated cell by cell, like a grid.",

  callout:{title:"Every row and cell must be focusable", text:"While using a grid-like widget, screen readers usually switch to application mode and announce only focusable elements. A plain-text Summary cell that isn't focusable (and contains nothing focusable) can be skipped entirely. So every row and cell must be focusable or contain a focusable element; the only exception is a column header with no function."},
  demos:[{kind:"treegrid", title:"Email inbox treegrid", note:"Uses the “rows first, cells reachable” model. Right Arrow on a collapsed thread expands it; Right again moves into its cells. Left from the first cell returns to the row, and Left on an expanded row collapses it. Up and Down skip hidden replies. Tab moves to the sender link in the row, then out of the grid. Enter on a row toggles it."}],
  sections:[
    {id:"models", title:"Three navigation models", table:{caption:"Treegrid navigation models", head:["Model","Best for"], rows:[["Rows first, cells reachable","A treegrid that mainly behaves like a tree, with cells available when needed"],["Cells first, rows reachable","A treegrid that mainly behaves like a grid, with a row view for the tree"],["Cells only","A treegrid that behaves almost entirely like a grid"]]}, after:"<p>There's deliberately no “rows only” model. If cells never need focus, the columns always fit without scrolling, and the row makes sense read as one string, it's a Tree View laid out in columns, not a treegrid.</p>"}
  ],
  keyboardTables:[
    {title:"Focus on a row", rows:[["Right Arrow","Collapsed: expands. Expanded or no children: moves to the first cell."],["Left Arrow","Expanded: collapses. Otherwise moves to the parent row."],["Down / Up Arrow","Next or previous visible row."],["Tab","First focusable widget in the row, if any."],["Home / End","First or last row."],["Ctrl + Home / Ctrl + End","First or last row."],["Enter","The row's default action, often expand or collapse."]]},
    {title:"Focus on a cell", rows:[["Right Arrow","One cell right; stops at the last cell."],["Left Arrow","One cell left; from the first cell, back to the row (if rows are focusable)."],["Down / Up Arrow","The cell below or above in the same column."],["Tab","Next focusable widget in the row; if none, leaves the treegrid."],["Home / End","First or last cell in the row."],["Ctrl + Home / Ctrl + End","Same column in the first or last row."],["Enter","The cell's default action."]]}
  ],
  roles:[
    ["Container","role=\"treegrid\"","With aria-label or aria-labelledby; aria-multiselectable if needed."],
    ["Each row","role=\"row\"","Roving tabindex (if rows are focusable); aria-level, aria-setsize, aria-posinset; aria-expanded on rows with children; aria-selected if selectable."],
    ["Each cell","role=\"gridcell\" / \"rowheader\" / \"columnheader\"","Roving tabindex; aria-selected, aria-readonly as needed."],
    ["Sortable header","aria-sort","As in Grid."]

treeview:{
  name:"Tree View", apg:APG+"treeview/", example:APG+"treeview/examples/treeview-1a/",
  kw:"tree view treeitem hierarchy expand collapse aria-expanded aria-level file directory multi-select",
  summary:"A hierarchical list where items with children can be expanded and collapsed.",
  what:"A tree view presents a hierarchy: any item may have children, and parents can be expanded or collapsed. The classic example is a file browser. Unlike a nested list, it's a single widget with one tab stop; arrow keys move between visible items and open or close branches, and items inside collapsed branches are skipped.",
  parts:[["Node","Any item in the tree."],["Root node","A node with no parent."],["Child node","A node with a parent."],["End node","A node with no children."],["Parent node","A node with children; open (expanded) or closed (collapsed)."]],
  demos:[
    {kind:"tree-single", title:"Single-select file directory", note:"Arrow around without selecting anything: focus and selection are independent. Enter or Space selects the focused node. Try letters for type-ahead and * to expand all siblings."},
    {kind:"tree-multi", title:"Multi-select checkbox tree", note:"Uses aria-checked and aria-multiselectable=\"true\". Space toggles the focused node. Parents showing a mixed state from their children is a common convention layered on top, not an APG requirement."}
  ],
  sections:[
    {id:"focus-selection", title:"Focus and selection are different", table:{caption:"Focus vs selection", head:["Concept","Meaning"], rows:[["Focus","Which node the keyboard is on. Exactly one node always has focus."],["Selection","Which nodes are chosen for an action. None, one or many."]]}, after:"<p>Some single-select trees make selection follow focus, which is efficient but means users can't browse without changing the selection. Both demos here keep them separate. In multi-select trees, APG requires selection to be distinct from focus.</p>"},
    {id:"multi", title:"Multi-select models", table:{caption:"Tree multi-select models", head:["Model","How it works"], rows:[["Recommended (no modifier)","Space toggles the focused node; arrows move without changing selection; optional Shift+arrow and Ctrl+A."],["Alternative (modifier keys)","Arrows select only the newly focused node; Ctrl+arrow moves without selecting; Shift+arrow extends; Ctrl+Space toggles."]]}},
    {id:"levels", title:"Computed or declared levels", html:"<p>Nesting treeitems inside <code>role=\"group\"</code> lets browsers compute aria-level, aria-setsize and aria-posinset. If nodes load dynamically (the full set isn't in the DOM), declare those values explicitly.</p>"},
    {id:"not-nav", title:"Not for ordinary site navigation", html:"<p>A navigation menu styled like a tree doesn't need the full tree keyboard model; use the <a href=\"#/apg/disclosure\">Disclosure</a> pattern. A tree earns its complexity for genuinely hierarchical content, such as documentation users explore branch by branch. APG's navigation tree also marks the current page with <code>aria-current=\"page\"</code>, keeps that node's tabindex at 0, and expands its branch when focus leaves the tree so the marker stays visible.</p>"}
  ],
  keyboard:[["Right Arrow","Closed parent: opens it. Open parent: moves to its first child. End node: nothing."],["Left Arrow","Open parent: closes it. Child that's closed or an end node: moves to its parent. Root that's closed or an end node: nothing."],["Down / Up Arrow","Next or previous visible node, without opening or closing anything."],["Home / End","First or last visible node."],["Enter","Activates the node (often toggles a parent; may select in single-select trees)."],["Space","Selects (single-select) or toggles selection (multi-select)."],["Type a letter","Moves to the next visible node starting with it."],["* (optional)","Expands all closed siblings at the current level."]],
  roles:[
    ["Container","role=\"tree\"","With aria-label or aria-labelledby; aria-multiselectable=\"true\" only for multi-select."],
    ["Each node","role=\"treeitem\"","Roving tabindex."],
    ["Parent nodes only","aria-expanded=\"true\" / \"false\"","Never on end nodes, which would falsely announce them as expandable."],
    ["Nodes","aria-selected or aria-checked","Selection state; one convention per tree."],
    ["Each branch","role=\"group\"","Wraps a parent's children; lets browsers compute levels."],
    ["Nodes (dynamic trees)","aria-level, aria-setsize, aria-posinset","Declared when the browser can't compute them."]
  ],
  code:[{label:"Tree markup", code:String.raw`<ul role="tree" aria-label="Files">
  <li role="treeitem" aria-expanded="false" aria-selected="false" tabindex="0">
    <span>Projects</span>
    <ul role="group">
      <li role="treeitem" aria-selected="false" tabindex="-1">project-1.docx</li>
      <li role="treeitem" aria-selected="false" tabindex="-1">project-2.docx</li>
    </ul>
  </li>
  <li role="treeitem" aria-selected="false" tabindex="-1">Budget.xlsx</li>
</ul>`}],
  mistakes:[
    ["aria-expanded on end nodes","Announced as expandable when they aren't."],
    ["Selection follows focus by accident","Users can't browse without committing."],
    ["Arrows or type-ahead reach hidden nodes","Closed must mean hidden."],
    ["Tree used for simple site navigation","Use disclosures."],
    ["aria-selected and aria-checked mixed","Pick one."],
    ["Every node is a tab stop","The tree should be one stop."]
  ],
  good:"A named tree with one tab stop, Right and Left meaning deeper and shallower, hidden nodes skipped, aria-expanded only on parents, one selection attribute, and focus kept distinct from selection.",
  wcag:[["2.1.1","Navigation, expanding and selecting work by keyboard."],["2.4.3","Arrow order matches the visual order, including opened branches."],["4.1.2","Nodes expose role, expanded state and selected or checked state."],["2.4.7","The focused node is visible and distinct from the selected highlight."],["1.4.1","Selected and checked states aren't shown by colour alone."]],
  quiz:[
    {q:"Should an end node have aria-expanded=\"false\"?", o:["Yes","No; leave it off"], a:1, e:"Any aria-expanded value tells users it can open."},
    {q:"What does Left Arrow do on a child node that's closed?", o:["Nothing","Moves focus to its parent"], a:1, e:"Left means “go shallower”."}
  ],
  recap:"A tree view is a hierarchical list with one tab stop. Right means deeper (open, then step in) and Left means shallower (close, then step up); hidden nodes are skipped. aria-expanded only on parents, groups around branches, one selection attribute, and focus separate from selection. Use disclosures, not trees, for ordinary navigation."
}
